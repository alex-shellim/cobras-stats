function fmtDate(iso, long = false) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const day = dt.toLocaleDateString("en-GB", { weekday: "short" });
  const mon = dt.toLocaleDateString("en-GB", { month: "short" });
  return long ? `${day} ${d} ${mon} ${y}` : `${day} ${d} ${mon}`;
}

const sum = (obj) => Object.values(obj || {}).reduce((a, b) => a + (b || 0), 0);
const ourScore = (m) => sum(m.goals);
const stripZeros = (obj) =>
  Object.fromEntries(Object.entries(obj || {}).filter(([, v]) => v > 0));
const pad2 = (n) => String(n).padStart(2, "0");

// home/away aware sides for display: l/r names, ls/rs scores
function sides(teamName, opposition, us, them, home) {
  const opp = opposition || "Opposition";
  return home
    ? { l: teamName, ls: us, r: opp, rs: them, home: true }
    : { l: opp, ls: them, r: teamName, rs: us, home: false };
}

function Stepper({ value, onDec, onInc, tone = "plain", disabled = false }) {
  const dec =
    "h-11 w-11 flex items-center justify-center rounded-xl border border-slate-200 text-slate-500 active:bg-slate-100 disabled:opacity-30 disabled:pointer-events-none";
  const incGoal =
    "h-11 w-11 flex items-center justify-center rounded-xl bg-emerald-600 text-white active:bg-emerald-700 disabled:opacity-40 disabled:pointer-events-none";
  const incPlain =
    "h-11 w-11 flex items-center justify-center rounded-xl bg-slate-800 text-white active:bg-slate-900 disabled:opacity-40 disabled:pointer-events-none";
  return (
    <div className={"flex items-center gap-2" + (disabled ? " opacity-60" : "")}>
      <button
        onClick={onDec}
        disabled={disabled || value <= 0}
        className={dec}
        aria-label="decrease"
      >
        <Minus size={18} strokeWidth={2.5} />
      </button>
      <span className="w-6 text-center text-lg font-semibold tabular-nums text-slate-900">
        {value}
      </span>
      <button
        onClick={onInc}
        disabled={disabled}
        className={tone === "goal" ? incGoal : incPlain}
        aria-label="increase"
      >
        <Plus size={18} strokeWidth={2.5} />
      </button>
    </div>
  );
}

function Modal({
  title,

  onCancel,

  onSecondary,

}) {

  const neutral =
    "w-full rounded-xl border border-slate-200 py-2.5 text-sm font-medium text-slate-700 active:bg-slate-50";
  const secondary =
    "w-full rounded-xl border border-rose-200 py-2.5 text-sm font-semibold text-rose-600 active:bg-rose-50";
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center p-4 sm:items-center" style={{ backgroundColor: "rgba(15,23,42,0.45)" }}>
      <div className="w-full max-w-sm rounded-2xl bg-white p-5 shadow-xl">
        <h3 className="text-base font-semibold text-slate-900">{title}</h3>
        {body && <p className="mt-1 text-sm text-slate-500">{body}</p>}
        {single ? (
          <div className="mt-5">
            <button onClick={onConfirm} className={confirmCls}>
              {confirmLabel}

          </div>
        ) : secondaryLabel ? (
          <div className="mt-5 flex flex-col gap-2">
            <button onClick={onConfirm} className={confirmCls}>
              {confirmLabel}
            </button>
            <button onClick={onSecondary} className={secondary}>
              {secondaryLabel}

            <button onClick={onCancel} className={neutral}>

            </button>

        ) : (
          <div className="mt-5 flex flex-col gap-2">

    </div>

}

// ---------- App (Firestore-backed, shared in real time) ----------

function App() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("scorers");
  const [toast, setToast] = useState(null);
  const [banner, setBanner] = useState(docRef ? "" : "offline");
  const dirty = useRef(false);
  const dataRef = useRef(null);
  const writeTimer = useRef(null);
  const toastTimer = useRef(null);

  const writeNow = (next) => {
    if (!docRef) return;
    docRef.set(next)
      .then(() => setBanner((b) => (b === "save-error" ? "" : b)))
      .catch((err) => { console.error("Save failed:", err); setBanner("save-error"); })
      .finally(() => { dirty.current = false; });
  };

  useEffect(() => {
    if (!docRef) {
      const s = seed();
      dataRef.current = s;
      setData(s);
      return;
    }
    const unsub = docRef.onSnapshot(
      (snap) => {
        if (!snap.exists) {
          const s = seed();
          dataRef.current = s;
          setData(s);
          writeNow(s);
          return;
        }
        if (snap.metadata.hasPendingWrites) return; // our own optimistic write echoing back
        if (dirty.current) return;                  // don't clobber an in-progress edit
        const incoming = normalize(snap.data());
        if (JSON.stringify(incoming) === JSON.stringify(dataRef.current)) return;
        dataRef.current = incoming;
        setData(incoming);
      },
      (err) => { console.error("Read failed:", err); setBanner("read-error"); }
    );
    return unsub;
  }, []);

  // wrapped updater: local state now, debounced write to Firestore
  const update = (fnOrVal) => {
    setData((prev) => {
      const next = typeof fnOrVal === "function" ? fnOrVal(prev) : fnOrVal;
      dataRef.current = next;
      dirty.current = true;
      clearTimeout(writeTimer.current);
      writeTimer.current = setTimeout(() => writeNow(next), 600);
      return next;
    });
  };

  const flash = (msg, action) => {
    clearTimeout(toastTimer.current);
    setToast({ msg, action: action || null });
    toastTimer.current = setTimeout(() => setToast(null), action ? 5000 : 1800);
  };
  const dismissToast = () => {
    clearTimeout(toastTimer.current);
    setToast(null);
  };

  if (!data) {
    return (
      <div className="flex min-h-screen items-center justify-center bg-slate-50 text-sm text-slate-400">
        Loading…
      </div>
    );
  }

  const { roster, matches, live, teamName, clubName } = data;
  const nameOf = (id) => (roster.find((p) => p.id === id) || {}).name || "—";

  const appeared = (m, pid) =>
    (m.appearances || []).includes(pid) || (m.goals && m.goals[pid] > 0) || (m.assists && m.assists[pid] > 0);
  const stats = roster
    .filter((p) => p.active)
    .map((p) => ({
      ...p,
      games: matches.filter((m) => appeared(m, p.id)).length,
      goals: matches.reduce((a, m) => a + ((m.goals && m.goals[p.id]) || 0), 0),
      assists: matches.reduce((a, m) => a + ((m.assists && m.assists[p.id]) || 0), 0)
    }))
    .sort((a, b) => b.goals - a.goals || b.assists - a.assists || b.games - a.games || a.name.localeCompare(b.name));

  const bannerText = {
    offline: "Not connected to a database — add your Firebase config to save. Changes now are temporary.",
    "save-error": "Couldn't save — check your Firestore rules allow writes to season/current.",
    "read-error": "Couldn't reach the database — check your config and rules."
  };

  return (
    <div className="min-h-screen bg-white text-slate-900">
      <div className="mx-auto flex min-h-screen max-w-md flex-col">
        {banner && (
          <div className={"px-4 py-2 text-center text-xs font-medium " + (banner === "offline" ? "bg-amber-100 text-amber-800" : "bg-rose-100 text-rose-800")}>
            {bannerText[banner]}
          </div>
        )}
        <main className="flex-1 px-4 pb-28 pt-6">
          {tab === "scorers" && (<Scorers stats={stats} setData={update} roster={roster} teamName={teamName} clubName={clubName} flash={flash} />)}
          {tab === "matches" && (<Matches data={data} setData={update} nameOf={nameOf} roster={roster} teamName={teamName} flash={flash} />)}
          {tab === "live" && (<Live data={data} setData={update} roster={roster} teamName={teamName} setTab={setTab} flash={flash} />)}
        </main>

        {toast && (
          <div className="pointer-events-none fixed inset-x-0 bottom-24 z-40 flex justify-center px-4">
            <div className="pointer-events-auto flex items-center gap-3 rounded-full bg-slate-900 py-2 pl-4 pr-2 text-sm font-medium text-white shadow-lg">
              <span>{toast.msg}</span>
              {toast.action && (
                <button
                  onClick={() => {
                    toast.action.onClick();
                    dismissToast();
                  }}
                  className="rounded-full bg-white/15 px-3 py-1 text-sm font-semibold text-white active:bg-white/25"
                >
                  {toast.action.label}
                </button>
              )}
            </div>
          </div>
        )}

        <nav className="fixed inset-x-0 bottom-0 z-30 mx-auto flex max-w-md items-center gap-3 px-5 pb-6 pt-3">
          <div className="flex flex-1 items-center gap-1 rounded-[26px] border border-white/70 bg-white/70 p-1.5 shadow-lg shadow-black/5 backdrop-blur-xl">
            {[
              { id: "scorers", label: "Team", Icon: UsersGlyph },
              { id: "matches", label: "Results", Icon: CalendarGlyph }
            ].map(({ id, label, Icon }) => {
              const on = tab === id;
              return (
                <button
                  key={id}
                  onClick={() => setTab(id)}
                  className={
                    "flex flex-1 items-center justify-center gap-2 rounded-[20px] px-3 py-2.5 text-sm font-bold transition-colors " +
                    (on ? "bg-[#0e0f0c] text-white" : "text-[#454745] active:bg-black/5")
                  }
                >
                  <Icon size={20} strokeWidth={on ? 2.4 : 2} />
                  {label}
                </button>
              );
            })}
          </div>
          <button
            onClick={() => setTab("live")}
            aria-label="Live match"
            className={
              "relative flex h-[52px] w-[52px] shrink-0 items-center justify-center rounded-full border border-white/70 shadow-lg shadow-black/5 backdrop-blur-xl transition-colors " +
              (tab === "live" ? "bg-[#0e0f0c] text-white" : "bg-white/70 text-[#0e0f0c]")
            }
          >
            <SoccerballGlyph size={26} />
            {live && (
              <span className="absolute -right-0.5 -top-0.5 h-3 w-3 rounded-full bg-rose-500 ring-2 ring-white" />
            )}
          </button>
        </nav>
      </div>
    </div>
  );
}

// ---------- Team (Top Scorers) + Squad editor ----------

function StatCells({ cells, muted, dark }) {
  const divider = dark ? "bg-white/20" : "bg-[#16330014]";
  const text = dark
    ? muted
      ? "font-light text-white"
      : "font-bold text-white"
    : muted
    ? "font-medium text-[#454745]"
    : "font-bold text-black";
  return (
    <div className="flex shrink-0 items-stretch gap-1 self-stretch">
      {cells.map((c, i) => (
        <React.Fragment key={i}>
          {i > 0 && <div className={"w-px shrink-0 " + divider} />}
          <div
            className={
              "flex w-8 items-center justify-center text-center text-base tabular-nums " + text
            }
          >
            {c}
          </div>
        </React.Fragment>
      ))}
    </div>
  );
}

function Scorers({ stats, setData, roster, teamName, clubName, flash }) {
  const [manage, setManage] = useState(false);
  const [name, setName] = useState("");

  const [deleteTeam, setDeleteTeam] = useState(false);

    setData((d) => ({ ...d, roster: [...d.roster, { id: uid(), name: n, active: true }] }));
    setName("");

  const rename = (id, value) =>
    setData((d) => ({
      ...d,
      roster: d.roster.map((p) => (p.id === id ? { ...p, name: value } : p)),
    }));

  return (
    <div>
      <StickyHeader>

          <h1 className="flex-1 truncate text-[34px] font-bold leading-none tracking-tight text-[#0e0f0c]">
            {manage ? "Manage" : "Team"}
          </h1>
          <button
            onClick={() => setManage((v) => !v)}
            className="shrink-0 rounded-full bg-[#16330014] px-4 py-1.5 text-base font-bold text-[#454745] active:bg-[#1633001f]"
          >
            {manage ? "Done" : "Manage"}

      </StickyHeader>

      {manage ? (

          <div className="flex flex-col gap-2">

            <input
              value={clubName}
              onChange={(e) => setData((d) => ({ ...d, clubName: e.target.value }))}

              className="h-11 w-full rounded-lg border border-[#0e0f0c33] px-3 text-base text-[#0e0f0c] outline-none placeholder:text-[#0e0f0c66] focus:border-[#0e0f0c]"

            />

function Matches({ data, setData, nameOf, roster, teamName, flash }) {
  const [openId, setOpenId] = useState(null);
  const { matches } = data;
  const match = matches.find((m) => m.id === openId);

  if (match) {
    return (
      <MatchDetail
        match={match}
        setData={setData}
        nameOf={nameOf}
        roster={roster}
        teamName={teamName}
        onBack={() => setOpenId(null)}
        flash={flash}
      />
    );
  }

  const sorted = [...matches].sort((a, b) => (a.date < b.date ? 1 : -1));

  return (
    <div>
      <StickyHeader>
        <p className="truncate text-xs font-semibold uppercase tracking-widest text-emerald-600">
          {teamName}
        </p>
        <h1 className="text-2xl font-bold tracking-tight">Matches</h1>
      </StickyHeader>

      {sorted.length === 0 ? (
        <Empty
          icon={<CalendarDays size={26} />}
          title="No matches yet"
          body="Head to the Live tab to record your first match. It'll appear here when you finish."
        />
      ) : (
        <div className="mt-5 space-y-2.5">
          {sorted.map((m) => {
            const us = ourScore(m);
            const home = m.home ?? true;
            const s = sides(teamName, m.opposition, us, m.oppGoals, home);
            return (
              <button
                key={m.id}
                onClick={() => setOpenId(m.id)}
                className="flex w-full items-center gap-3 rounded-2xl border border-slate-200 bg-white px-4 py-3.5 text-left active:bg-slate-50"
              >
                <ResultBadge us={us} them={m.oppGoals} />
                <div className="min-w-0 flex-1">
                  <div className="truncate font-semibold">
                    {s.l} <span className="text-slate-300">v</span> {s.r}
                  </div>
                  <div className="text-xs text-slate-400">
                    {fmtDate(m.date, true)} · {home ? "Home" : "Away"}
                  </div>
                </div>
                <div className="shrink-0 text-lg font-bold tabular-nums">
                  {s.ls}
                  <span className="mx-1 text-slate-300">–</span>
                  {s.rs}
                </div>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function MatchDetail({ match, setData, nameOf, roster, teamName, onBack, flash }) {
  const [editing, setEditing] = useState(false);
  const [del, setDel] = useState(false);
  const [draft, setDraft] = useState(null);

  const startEdit = () => {
    setDraft({
      date: match.date,
      opposition: match.opposition || "",
      goals: { ...(match.goals || {}) },
      assists: { ...(match.assists || {}) },
      oppGoals: match.oppGoals || 0,
      home: match.home ?? true,
    });
    setEditing(true);
  };

  const bump = (field, pid, delta) =>
    setDraft((d) => ({
      ...d,
      [field]: { ...d[field], [pid]: Math.max(0, (d[field][pid] || 0) + delta) },
    }));

  const save = () => {
    setData((data) => ({
      ...data,
      matches: data.matches.map((m) =>
        m.id === match.id
          ? {
              ...m,
              date: draft.date,
              opposition: draft.opposition.trim(),
              goals: stripZeros(draft.goals),
              assists: stripZeros(draft.assists),
              oppGoals: draft.oppGoals,
              home: draft.home,
            }
          : m
      ),
    }));
    setEditing(false);
    flash("Match updated");
  };

  const editablePlayers = roster.filter(
    (p) => p.active || match.goals?.[p.id] || match.assists?.[p.id]
  );
  const scorers = Object.entries(match.goals || {}).filter(([, v]) => v > 0);
  const assisters = Object.entries(match.assists || {}).filter(([, v]) => v > 0);
  const us = ourScore(match);
  const home = match.home ?? true;
  const s = sides(teamName, match.opposition, us, match.oppGoals, home);

  return (
    <div>
      <StickyHeader>
        <div className="flex items-center justify-between">
          <button
            onClick={editing ? () => setEditing(false) : onBack}
            className="-ml-2 flex items-center gap-1 rounded-lg px-2 py-1 text-sm font-medium text-slate-500 active:bg-slate-100"
          >
            <ChevronLeft size={18} /> {editing ? "Cancel" : "Matches"}
          </button>
          {!editing && (
            <div className="flex gap-1">
              <button
                onClick={startEdit}
                className="flex items-center gap-1 rounded-lg px-2.5 py-1.5 text-sm font-medium text-slate-600 active:bg-slate-100"
              >
                <Pencil size={15} /> Edit
              </button>
              <button
                onClick={() => setDel(true)}
                className="flex items-center gap-1 rounded-lg px-2.5 py-1.5 text-sm font-medium text-rose-500 active:bg-rose-50"
              >
                <Trash2 size={15} /> Delete
              </button>
            </div>
          )}
        </div>
      </StickyHeader>

      {!editing ? (
        <>
          <div className="mt-3 rounded-2xl border border-slate-200 bg-white p-5 text-center">
            <div className="flex items-center justify-center gap-2 text-xs font-medium text-slate-400">
              <ResultBadge us={us} them={match.oppGoals} />
              {fmtDate(match.date, true)} · {home ? "Home" : "Away"}
            </div>
            <div className="mt-3 flex items-center justify-center gap-3">
              <div className="min-w-0 flex-1 truncate text-right text-sm font-semibold text-slate-500">
                {s.l}
              </div>
              <div className="shrink-0 text-4xl font-bold tabular-nums">
                {s.ls}
                <span className="mx-2 text-slate-300">–</span>
                {s.rs}
              </div>
              <div className="min-w-0 flex-1 truncate text-left text-sm font-semibold text-slate-500">
                {s.r}
              </div>
            </div>
          </div>

          <Section title="Goals">
            {scorers.length ? (
              scorers.map(([pid, v]) => (
                <StatRow key={pid} name={nameOf(pid)} count={v} tone="goal" />
              ))
            ) : (
              <p className="px-4 py-3 text-sm text-slate-400">No goals recorded.</p>
            )}
          </Section>

          <Section title="Assists">
            {assisters.length ? (
              assisters.map(([pid, v]) => <StatRow key={pid} name={nameOf(pid)} count={v} />)
            ) : (
              <p className="px-4 py-3 text-sm text-slate-400">No assists recorded.</p>
            )}
          </Section>
        </>
      ) : (
        <div className="mt-3 space-y-4">
          <div className="rounded-2xl border border-slate-200 bg-white p-4">
            <label className="text-xs font-semibold uppercase tracking-wider text-slate-400">
              Date
            </label>
            <input
              type="date"
              value={draft.date}
              onChange={(e) => setDraft((d) => ({ ...d, date: e.target.value }))}
              className="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-emerald-500"
            />
            <label className="mt-3 block text-xs font-semibold uppercase tracking-wider text-slate-400">
              Opposition
            </label>
            <input
              value={draft.opposition}
              onChange={(e) => setDraft((d) => ({ ...d, opposition: e.target.value }))}
              placeholder="e.g. Riverside FC"
              className="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-emerald-500"
            />
            <label className="mt-3 block text-xs font-semibold uppercase tracking-wider text-slate-400">
              Venue
            </label>
            <div className="mt-1 grid grid-cols-2 gap-2">
              {[
                { v: true, label: "Home" },
                { v: false, label: "Away" },
              ].map(({ v, label }) => (
                <button
                  key={label}
                  onClick={() => setDraft((d) => ({ ...d, home: v }))}
                  className={
                    "rounded-xl py-2.5 text-sm font-semibold " +
                    (draft.home === v
                      ? "bg-emerald-600 text-white"
                      : "border border-slate-200 text-slate-600 active:bg-slate-50")
                  }
                >
                  {label}
                </button>
              ))}
            </div>
          </div>

          <div className="rounded-2xl border border-slate-200 bg-white p-4">
            <div className="flex items-center justify-between">
              <span className="text-sm font-semibold">Opposition goals</span>
              <Stepper
                value={draft.oppGoals}
                onDec={() => setDraft((d) => ({ ...d, oppGoals: Math.max(0, d.oppGoals - 1) }))}
                onInc={() => setDraft((d) => ({ ...d, oppGoals: d.oppGoals + 1 }))}
              />
            </div>
          </div>

          <EditPlayers players={editablePlayers} draft={draft} bump={bump} />

          <button
            onClick={save}
            className="w-full rounded-2xl bg-emerald-600 py-3.5 font-semibold text-white active:bg-emerald-700"
          >
            Save changes
          </button>
        </div>
      )}

      {del && (
        <Modal
          title="Delete this match?"
          body="This removes the match and its goals and assists from your season totals. It can't be undone."
          confirmLabel="Delete"
          danger
          onCancel={() => setDel(false)}
          onConfirm={() => {
            setData((d) => ({ ...d, matches: d.matches.filter((m) => m.id !== match.id) }));
            flash("Match deleted");
            onBack();
          }}
        />
      )}
    </div>
  );
}

function EditPlayers({ players, draft, bump }) {
  if (players.length === 0)
    return (
      <p className="rounded-2xl border border-dashed border-slate-200 px-4 py-3 text-sm text-slate-400">
        Add players from the Top Scorers tab to record scorers.
      </p>
    );
  return (
    <div className="overflow-hidden rounded-2xl border border-slate-200 bg-white">
      {players.map((p) => (
        <div key={p.id} className="border-b border-slate-50 px-4 py-3 last:border-0">
          <div className="font-medium">{p.name}</div>
          <div className="mt-2 flex items-center gap-2">
            <span className="w-14 text-xs font-semibold uppercase tracking-wider text-emerald-600">
              Goals
            </span>
            <Stepper
              tone="goal"
              value={draft.goals[p.id] || 0}
              onDec={() => bump("goals", p.id, -1)}
              onInc={() => bump("goals", p.id, 1)}
            />
          </div>
          <div className="mt-2 flex items-center gap-2">
            <span className="w-14 text-xs font-semibold uppercase tracking-wider text-slate-400">
              Assists
            </span>
            <Stepper
              value={draft.assists[p.id] || 0}
              onDec={() => bump("assists", p.id, -1)}
              onInc={() => bump("assists", p.id, 1)}
            />
          </div>
        </div>
      ))}
    </div>
  );
}

function StatRow({ name, count, tone }) {
  return (
    <div className="flex items-center justify-between border-b border-slate-50 px-4 py-3 last:border-0">
      <span className="font-medium">{name}</span>
      <span
        className={
          "rounded-lg px-2 py-0.5 text-sm font-bold tabular-nums " +
          (tone === "goal" ? "bg-emerald-50 text-emerald-700" : "bg-slate-100 text-slate-600")
        }
      >
        ×{count}
      </span>
    </div>
  );
}

function Section({ title, children }) {
  return (
    <div className="mt-4">
      <h2 className="mb-2 px-1 text-xs font-semibold uppercase tracking-wider text-slate-400">
        {title}
      </h2>
      <div className="overflow-hidden rounded-2xl border border-slate-200 bg-white">{children}</div>
    </div>
  );
}

// ---------- Live ----------

function Live({ data, setData, roster, teamName, setTab, flash }) {
  const [confirmEnd, setConfirmEnd] = useState(false);
  const [oppSheet, setOppSheet] = useState(false);
  const [oppDraft, setOppDraft] = useState("");
  const [warn, setWarn] = useState(null);
  const { live } = data;

  const start = () =>
    setData((d) => ({
      ...d,
      live: {
        date: today(),
        opposition: "",
        home: true,
        goals: {},
        assists: {},
        oppGoals: 0,
        playing: Object.fromEntries(
          d.roster.filter((p) => p.active).map((p) => [p.id, true])
        ),
      },
    }));

  if (!live) {
    return (
      <div className="flex min-h-96 flex-col">
        <StickyHeader>
          <p className="truncate text-xs font-semibold uppercase tracking-widest text-emerald-600">
            {teamName}
          </p>
          <h1 className="text-2xl font-bold tracking-tight">Live</h1>
        </StickyHeader>
        <div className="flex flex-1 flex-col items-center justify-center text-center">
          <div className="flex h-16 w-16 items-center justify-center rounded-2xl bg-slate-100 text-slate-400">
            <Radio size={30} />
          </div>
          <p className="mt-4 max-w-xs text-slate-500">
            No match in progress. Kick off to start tracking goals and assists in real time.
          </p>
          <button
            onClick={start}
            className="mt-6 rounded-full bg-[#163300] px-8 py-3.5 text-base font-bold text-white shadow-sm active:bg-black"
          >
            Start match
          </button>
        </div>
      </div>
    );
  }

  const us = ourScore(live);
  const s = sides(teamName, live.opposition, us, live.oppGoals, live.home);
  const bump = (field, pid, delta) =>
    setData((d) => ({
      ...d,
      live: {
        ...d.live,
        [field]: { ...d.live[field], [pid]: Math.max(0, (d.live[field][pid] || 0) + delta) },
      },
    }));
  const setOpp = (v) => setData((d) => ({ ...d, live: { ...d.live, opposition: v } }));
  const bumpOpp = (delta) =>
    setData((d) => ({ ...d, live: { ...d.live, oppGoals: Math.max(0, d.live.oppGoals + delta) } }));
  const toggleHome = () => setData((d) => ({ ...d, live: { ...d.live, home: !d.live.home } }));

  const isPlaying = (pid) => live.playing?.[pid] !== false;
  const setPlaying = (pid, val) =>
    setData((d) => ({ ...d, live: { ...d.live, playing: { ...d.live.playing, [pid]: val } } }));
  const tryToggle = (p) => {
    if (isPlaying(p.id)) {
      if ((live.goals[p.id] || 0) > 0 || (live.assists[p.id] || 0) > 0) {
        setWarn(p.name);
        return;
      }
      setPlaying(p.id, false);
    } else {
      setPlaying(p.id, true);
    }
  };

  const openOpp = () => {
    setOppDraft(live.opposition || "");
    setOppSheet(true);
  };
  const saveOpp = () => {
    setOpp(oppDraft.trim());
    setOppSheet(false);
  };

  const players = roster.filter((p) => p.active || live.goals[p.id] || live.assists[p.id]);

  const end = () => {
    const record = {
      id: uid(),
      date: live.date,
      opposition: live.opposition.trim(),
      home: live.home,
      goals: stripZeros(live.goals),
      assists: stripZeros(live.assists),
      oppGoals: live.oppGoals,
      appearances: players.filter((p) => isPlaying(p.id)).map((p) => p.id),
    };
    setData((d) => ({ ...d, matches: [record, ...d.matches], live: null }));
    setConfirmEnd(false);
    flash("Match saved to your season");
    setTab("matches");
  };
  const discard = () => {
    setData((d) => ({ ...d, live: null }));
    setConfirmEnd(false);
    flash("Match discarded");
  };

  return (
    <div className="space-y-4">
      {/* Scoreboard */}
      <div className="rounded-3xl bg-[#163300] p-4">
        <div className="flex items-center justify-center gap-4">
          <ScoreSide
            label={live.home ? "Home" : "Away"}
            score={s.ls}
            ours={live.home}
            teamName={teamName}
            opposition={live.opposition}
            onNameTap={openOpp}
          />
          <button
            onClick={toggleHome}
            aria-label="Swap home and away"
            className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#e2f6d5] text-[#163300] active:bg-[#d3efc0]"
          >
            <ArrowLeftRight size={20} />
          </button>
          <ScoreSide
            label={live.home ? "Away" : "Home"}
            score={s.rs}
            ours={!live.home}
            teamName={teamName}
            opposition={live.opposition}
            onNameTap={openOpp}
          />
        </div>
        {/* TODO: half-time behaviour — to be wired up in a later round */}
        <button
          onClick={() => {}}
          className="mt-6 h-11 w-full rounded-full bg-[#9fe870] text-base font-bold text-[#163300] active:bg-[#8fd95f]"
        >
          Half time
        </button>
      </div>

      {/* Opposition goals — kept for functionality (not shown in the Figma frame) */}
      <div className="flex items-center justify-between rounded-3xl bg-[#16330014] p-4">
        <span className="text-base font-bold text-[#0e0f0c]">Opposition goals</span>
        <div className="flex items-center gap-2">
          <button
            onClick={() => bumpOpp(-1)}
            disabled={live.oppGoals <= 0}
            aria-label="remove opposition goal"
            className="flex size-11 items-center justify-center rounded-full bg-[#16330014] text-[#0e0f0c] active:bg-[#1633001f] disabled:pointer-events-none disabled:opacity-40"
          >
            <Minus size={18} strokeWidth={2.5} />
          </button>
          <span className="w-8 text-center text-[22px] font-bold tabular-nums text-[#0e0f0c]">
            {live.oppGoals}
          </span>
          <button
            onClick={() => bumpOpp(1)}
            aria-label="add opposition goal"
            className="flex size-11 items-center justify-center rounded-full bg-[#9fe870] text-[#163300] active:bg-[#8fd95f]"
          >
            <Plus size={18} strokeWidth={2.5} />
          </button>
        </div>
      </div>

      {/* Players */}
      {players.length === 0 ? (
        <p className="rounded-3xl bg-[#16330014] p-4 text-sm text-[#454745]">
          No players yet. Add your squad from the Team tab — the match keeps running.
        </p>
      ) : (
        players.map((p) => {
          const playing = isPlaying(p.id);
          return (
            <div
              key={p.id}
              className={"rounded-3xl bg-[#16330014] p-4 " + (playing ? "" : "opacity-60")}
            >
              <div className="flex items-center justify-between">
                <div className="min-w-0 flex-1 truncate pr-3 text-base font-bold text-[#0e0f0c]">
                  {p.name}
                </div>
                <button
                  role="switch"
                  aria-checked={playing}
                  onClick={() => tryToggle(p)}
                  className="flex shrink-0 items-center gap-2"
                >
                  <span className="text-base font-light text-[#0e0f0c]">Playing</span>
                  <span
                    className={
                      "relative h-6 w-11 shrink-0 rounded-full transition-colors " +
                      (playing ? "bg-[#34c759]" : "bg-black/20")
                    }
                  >
                    <span
                      className="absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-all"
                      style={{ left: playing ? 22 : 2 }}
                    />
                  </span>
                </button>
              </div>
              <div className="mt-3 flex items-start justify-between">
                <LiveStepper
                  label="Goal"
                  disabled={!playing}
                  value={live.goals[p.id] || 0}
                  onDec={() => bump("goals", p.id, -1)}
                  onInc={() => bump("goals", p.id, 1)}
                />
                <LiveStepper
                  label="Assist"
                  disabled={!playing}
                  value={live.assists[p.id] || 0}
                  onDec={() => bump("assists", p.id, -1)}
                  onInc={() => bump("assists", p.id, 1)}
                />
              </div>
            </div>
          );
        })
      )}

      <button
        onClick={() => setConfirmEnd(true)}
        className="w-full rounded-full border border-[#0e0f0c33] py-3 text-base font-bold text-[#0e0f0c] active:bg-[#16330014]"
      >
        Finish match
      </button>

      {confirmEnd && (
        <Modal
          title="Finish the match?"
          body={`Final score ${s.l} ${s.ls} – ${s.rs} ${s.r}. Saving adds it to your season and updates the totals. Discard throws it away.`}
          confirmLabel="Finish & save"
          secondaryLabel="Discard match"
          onConfirm={end}
          onSecondary={discard}
          onCancel={() => setConfirmEnd(false)}
        />
      )}

      {oppSheet && (
        <div className="fixed inset-0 z-50 flex items-end justify-center p-4 sm:items-center" style={{ backgroundColor: "rgba(15,23,42,0.45)" }}>
          <div className="w-full max-w-sm rounded-2xl bg-white p-5 shadow-xl">
            <h3 className="text-base font-semibold text-slate-900">Opposition name</h3>
            <input
              autoFocus
              value={oppDraft}
              onChange={(e) => setOppDraft(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && saveOpp()}
              placeholder="e.g. Riverside FC"
              className="mt-3 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-emerald-500"
            />
            <div className="mt-4 flex gap-2">
              <button
                onClick={() => setOppSheet(false)}
                className="flex-1 rounded-xl border border-slate-200 py-2.5 text-sm font-medium text-slate-700 active:bg-slate-50"
              >
                Cancel
              </button>
              <button
                onClick={saveOpp}
                className="flex-1 rounded-xl bg-emerald-600 py-2.5 text-sm font-semibold text-white active:bg-emerald-700"
              >
                Save
              </button>
            </div>
          </div>
        </div>
      )}

      {warn && (
        <Modal
          single
          title={`${warn} can't be benched`}
          body="They've already got a goal or assist in this match. Clear those first if they aren't playing."
          confirmLabel="Got it"
          onConfirm={() => setWarn(null)}
        />
      )}
    </div>
  );
}

function ScoreSide({ label, score, ours, teamName, opposition, onNameTap }) {
  return (
    <div className="flex min-w-0 flex-1 flex-col items-center gap-1 text-center">
      <div className="text-base font-light text-white">{label}</div>
      <div className="text-[34px] font-bold leading-none tabular-nums text-white">{score}</div>
      {ours ? (
        <div className="max-w-full truncate px-2 py-1 text-base font-bold text-white">
          {teamName.trim() || "Team"}
        </div>
      ) : (
        <button
          onClick={onNameTap}
          className="max-w-full truncate rounded-full bg-[#e2f6d5] px-3 py-1 text-base font-bold text-[#163300] active:bg-[#d3efc0]"
        >
          {opposition || "Add name"}
        </button>
      )}
    </div>
  );
}

function LiveStepper({ label, value, onDec, onInc, disabled }) {
  const base =
    "flex size-11 shrink-0 items-center justify-center rounded-full disabled:pointer-events-none disabled:opacity-40";
  return (
    <div className="flex items-center gap-2">
      <button
        onClick={onDec}
        disabled={disabled || value <= 0}
        aria-label={"decrease " + label}
        className={base + " bg-[#16330014] text-[#0e0f0c] active:bg-[#1633001f]"}
      >
        <Minus size={18} strokeWidth={2.5} />
      </button>
      <div className="flex w-10 flex-col items-center leading-none">
        <span className="text-[34px] font-bold tabular-nums text-[#0e0f0c]">{pad2(value)}</span>
        <span className="mt-0.5 text-xs font-light text-[#0e0f0c]">{label}</span>
      </div>
      <button
        onClick={onInc}
        disabled={disabled}
        aria-label={"increase " + label}
        className={base + " bg-[#9fe870] text-[#163300] active:bg-[#8fd95f]"}
      >
        <Plus size={18} strokeWidth={2.5} />
      </button>
    </div>
  );
}

function Empty({ icon, title, body }) {
  return (
    <div className="mt-10 flex flex-col items-center text-center">
      <div className="flex h-14 w-14 items-center justify-center rounded-2xl bg-slate-100 text-slate-400">
        {icon}
      </div>
      <h3 className="mt-4 font-semibold">{title}</h3>
      <p className="mt-1 max-w-xs text-sm text-slate-500">{body}</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
