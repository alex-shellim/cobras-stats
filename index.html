// The live match moved from goal/assist count maps to an event feed.
// Migrate any doc still on the old shape so older sessions keep working.
const normalizeLive = (l) => {
  if (!l) return null;
  if (Array.isArray(l.events)) return { active: l.active !== false, ...l };
  const events = [];
  Object.entries(l.goals || {}).forEach(([pid, n]) => {
    for (let i = 0; i < n; i++)
      events.push({ id: uid(), type: "team", scorerId: pid, assistId: null });
  });
  for (let i = 0; i < (l.oppGoals || 0); i++) events.push({ id: uid(), type: "opp" });
  return {
    date: l.date || today(),
    opposition: l.opposition || "",
    home: l.home !== false,
    playing: l.playing || {},
    active: true,
    events,
  };
};

function fmtDate(iso, long = false) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const day = dt.toLocaleDateString("en-GB", { weekday: "short" });
  const mon = dt.toLocaleDateString("en-GB", { month: "short" });
  return long ? `${day} ${d} ${mon} ${y}` : `${day} ${d} ${mon}`;
}

const sum = (obj) => Object.values(obj || {}).reduce((a, b) => a + (b || 0), 0);
const ourScore = (m) => sum(m.goals);

// home/away aware sides for display: l/r names, ls/rs scores
function sides(teamName, opposition, us, them, home) {
  const opp = opposition || "Opposition";
  return home
    ? { l: teamName, ls: us, r: opp, rs: them, home: true }
    : { l: opp, ls: them, r: teamName, rs: us, home: false };
}

function Stepper({ value, onDec, onInc, tone = "plain", disabled = false }) {
  const dec =

  const incPlain =
    "h-11 w-11 flex items-center justify-center rounded-xl bg-slate-800 text-white active:bg-slate-900 disabled:opacity-40 disabled:pointer-events-none";
  return (
    <div className={"flex items-center gap-2" + (disabled ? " opacity-60" : "")}>
      <button
        onClick={onDec}
        disabled={disabled || value <= 0}
        className={dec}
        aria-label="decrease"

      </button>
      <span className="w-6 text-center text-lg font-semibold tabular-nums text-slate-900">

      <button
        onClick={onInc}
        disabled={disabled}

}

// ---------- App (Firestore-backed, shared in real time) ----------

function App() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("scorers");
  const [toast, setToast] = useState(null);
  const [banner, setBanner] = useState(docRef ? "" : "offline");
  const dirty = useRef(false);
  const dataRef = useRef(null);
  const writeTimer = useRef(null);
  const toastTimer = useRef(null);

  const writeNow = (next) => {
    if (!docRef) return;
    docRef.set(next)
      .then(() => setBanner((b) => (b === "save-error" ? "" : b)))
      .catch((err) => { console.error("Save failed:", err); setBanner("save-error"); })
      .finally(() => { dirty.current = false; });
  };

  useEffect(() => {
    if (!docRef) {
      const s = seed();
      dataRef.current = s;
      setData(s);
      return;
    }
    const unsub = docRef.onSnapshot(
      (snap) => {
        if (!snap.exists) {
          const s = seed();
          dataRef.current = s;
          setData(s);
          writeNow(s);
          return;
        }
        if (snap.metadata.hasPendingWrites) return; // our own optimistic write echoing back
        if (dirty.current) return;                  // don't clobber an in-progress edit
        const incoming = normalize(snap.data());
        if (JSON.stringify(incoming) === JSON.stringify(dataRef.current)) return;
        dataRef.current = incoming;
        setData(incoming);
      },
      (err) => { console.error("Read failed:", err); setBanner("read-error"); }
    );
    return unsub;
  }, []);

  // wrapped updater: local state now, debounced write to Firestore
  const update = (fnOrVal) => {
    setData((prev) => {
      const next = typeof fnOrVal === "function" ? fnOrVal(prev) : fnOrVal;
      dataRef.current = next;
      dirty.current = true;
      clearTimeout(writeTimer.current);
      writeTimer.current = setTimeout(() => writeNow(next), 600);
      return next;
    });
  };

  const flash = (msg, action) => {
    clearTimeout(toastTimer.current);
    setToast({ msg, action: action || null });
    toastTimer.current = setTimeout(() => setToast(null), action ? 5000 : 1800);
  };
  const dismissToast = () => {
    clearTimeout(toastTimer.current);
    setToast(null);
  };

  if (!data) {
    return (
      <div className="flex min-h-screen items-center justify-center bg-slate-50 text-sm text-slate-400">
        Loading…
      </div>
    );
  }

  const { roster, matches, live, teamName, clubName } = data;
  const nameOf = (id) => (roster.find((p) => p.id === id) || {}).name || "—";

  const appeared = (m, pid) =>
    (m.appearances || []).includes(pid) || (m.goals && m.goals[pid] > 0) || (m.assists && m.assists[pid] > 0);
  const stats = roster
    .filter((p) => p.active)
    .map((p) => ({
      ...p,
      games: matches.filter((m) => appeared(m, p.id)).length,
      goals: matches.reduce((a, m) => a + ((m.goals && m.goals[p.id]) || 0), 0),
      assists: matches.reduce((a, m) => a + ((m.assists && m.assists[p.id]) || 0), 0)
    }))
    .sort((a, b) => b.goals - a.goals || b.assists - a.assists || b.games - a.games || a.name.localeCompare(b.name));

  const bannerText = {
    offline: "Not connected to a database — add your Firebase config to save. Changes now are temporary.",
    "save-error": "Couldn't save — check your Firestore rules allow writes to season/current.",
    "read-error": "Couldn't reach the database — check your config and rules."
  };

  return (
    <div className="min-h-screen bg-white text-slate-900">
      <div className="mx-auto flex min-h-screen max-w-md flex-col">
        {banner && (
          <div className={"px-4 py-2 text-center text-xs font-medium " + (banner === "offline" ? "bg-amber-100 text-amber-800" : "bg-rose-100 text-rose-800")}>
            {bannerText[banner]}
          </div>
        )}
        <main className="flex-1 px-4 pb-28 pt-6">
          {tab === "scorers" && (<Scorers stats={stats} setData={update} roster={roster} teamName={teamName} clubName={clubName} flash={flash} />)}
          {tab === "matches" && (<Matches data={data} setData={update} nameOf={nameOf} roster={roster} teamName={teamName} flash={flash} />)}
          {tab === "live" && (<Live data={data} setData={update} roster={roster} teamName={teamName} setTab={setTab} flash={flash} />)}
        </main>

        {toast && (

      : "font-bold text-white"

function matchToEvents(m) {
  if (Array.isArray(m.events)) return m.events;
  const scorers = [];
  Object.entries(m.goals || {}).forEach(([pid, n]) => {
    for (let i = 0; i < n; i++) scorers.push(pid);
  });
  const assisters = [];
  Object.entries(m.assists || {}).forEach(([pid, n]) => {
    for (let i = 0; i < n; i++) assisters.push(pid);
  });
  const ev = scorers.map((pid, i) => ({
    id: uid(),
    type: "team",
    scorerId: pid,
    assistId: assisters[i] || null,
  }));
  for (let i = 0; i < (m.oppGoals || 0); i++) ev.push({ id: uid(), type: "opp" });
  return ev;
}

function MatchDetail({ match, setData, nameOf, roster, teamName, onBack, flash }) {
  const [mode, setMode] = useState("view");
  const [tab, setTab] = useState("match");
  const [draft, setDraft] = useState(null);
  const baseRef = useRef(null);
  const [goalEditor, setGoalEditor] = useState(null);
  const [confirmClose, setConfirmClose] = useState(false);
  const [confirmSave, setConfirmSave] = useState(false);
  const [confirmDelEvt, setConfirmDelEvt] = useState(null);
  const [confirmDelMatch, setConfirmDelMatch] = useState(false);
  const [oppSheet, setOppSheet] = useState(false);
  const [oppDraft, setOppDraft] = useState("");

  const viewEvents = useMemo(() => matchToEvents(match), [match]);
  const editable = mode === "edit";
  const view = draft || {
    date: match.date,
    opposition: match.opposition || "",
    home: match.home ?? true,
    events: viewEvents,
    appearances: match.appearances || [],
  };

  const teamEv = view.events.filter((e) => e.type === "team");
  const us = teamEv.length;
  const them = view.events.filter((e) => e.type === "opp").length;
  const s = sides(teamName, view.opposition, us, them, view.home);
  const goalsOf = (pid) => teamEv.filter((e) => e.scorerId === pid).length;
  const assistsOf = (pid) => teamEv.filter((e) => e.assistId === pid).length;
  const lineUp = roster.filter(
    (p) =>
      p.active ||
      view.appearances.includes(p.id) ||
      teamEv.some((e) => e.scorerId === p.id || e.assistId === p.id)
  );
  const isPlaying = (pid) => view.appearances.includes(pid);

  const startEdit = () => {
    const d = {
      date: match.date,
      opposition: match.opposition || "",
      home: match.home ?? true,
      events: viewEvents.map((e) => ({ ...e })),
      appearances: [...(match.appearances || [])],
    };
    baseRef.current = JSON.stringify(d);
    setDraft(d);
    setMode("edit");
    setTab("match");
  };
  const dirty = () => draft && JSON.stringify(draft) !== baseRef.current;
  const exitEdit = () => {
    setDraft(null);
    setMode("view");
    setConfirmClose(false);
    setConfirmSave(false);
  };
  const commit = () => {
    const goals = {};
    const assists = {};
    draft.events
      .filter((e) => e.type === "team")
      .forEach((e) => {
        if (e.scorerId) goals[e.scorerId] = (goals[e.scorerId] || 0) + 1;
        if (e.assistId) assists[e.assistId] = (assists[e.assistId] || 0) + 1;
      });
    const updated = {
      ...match,
      date: draft.date,
      opposition: draft.opposition.trim(),
      home: draft.home,
      goals,
      assists,
      oppGoals: draft.events.filter((e) => e.type === "opp").length,
      appearances: draft.appearances,
      events: draft.events,
    };
    setData((dd) => ({
      ...dd,
      matches: dd.matches.map((m) => (m.id === match.id ? updated : m)),
    }));
    exitEdit();
    flash("Match updated");
  };
  const tryClose = () => (dirty() ? setConfirmClose(true) : exitEdit());
  const trySave = () => (dirty() ? setConfirmSave(true) : exitEdit());

  const updDraft = (fn) => setDraft((d) => fn(d));
  const toggleHome = () => updDraft((d) => ({ ...d, home: !d.home }));
  const onToggle = (p) =>
    updDraft((d) => ({
      ...d,
      appearances: d.appearances.includes(p.id)
        ? d.appearances.filter((x) => x !== p.id)
        : [...d.appearances, p.id],
    }));
  const addOppGoal = () =>
    updDraft((d) => ({ ...d, events: [...d.events, { id: uid(), type: "opp" }] }));
  const deleteEvent = (id) =>
    updDraft((d) => ({ ...d, events: d.events.filter((e) => e.id !== id) }));
  const saveGoalEvent = ({ scorerId, assistId }) => {
    const editId = goalEditor && goalEditor.eventId;
    updDraft((d) => ({
      ...d,
      events: editId
        ? d.events.map((e) => (e.id === editId ? { ...e, scorerId, assistId } : e))
        : [...d.events, { id: uid(), type: "team", scorerId, assistId }],
    }));
    setGoalEditor(null);
  };
  const openOpp = () => {
    setOppDraft(view.opposition || "");
    setOppSheet(true);
  };
  const saveOpp = () => {
    updDraft((d) => ({ ...d, opposition: oppDraft.trim() }));
    setOppSheet(false);
  };

  if (goalEditor) {
    const initial = goalEditor.eventId
      ? view.events.find((e) => e.id === goalEditor.eventId)
      : null;
    const pick = lineUp.filter(
      (p) =>
        isPlaying(p.id) ||
        (initial && (initial.scorerId === p.id || initial.assistId === p.id))
    );
    return (
      <SaveGoalScreen
        players={pick.length ? pick : lineUp}
        initial={initial}
        onSave={saveGoalEvent}
        onDiscard={() => {
          if (goalEditor.eventId) deleteEvent(goalEditor.eventId);
          setGoalEditor(null);
        }}
      />
    );
  }

  return (
    <div>
      <div className="sticky top-0 z-20 -mx-4 -mt-6 mb-4 space-y-4 border-b border-black/[0.06] bg-white/85 px-4 pb-4 pt-6 backdrop-blur-xl">
        {editable ? (
          <div className="flex items-center justify-between gap-3">
            <button
              onClick={tryClose}
              aria-label="Close"
              className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#0e0f0c] active:bg-[#1633001f]"
            >
              <X size={20} strokeWidth={2.5} />
            </button>
            <span className="text-base font-bold text-[#0e0f0c]">Edit match</span>
            <button
              onClick={trySave}
              aria-label="Save"
              className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#9fe870] text-[#163300] active:bg-[#8fd95f]"
            >
              <Check size={20} strokeWidth={2.5} />
            </button>
          </div>
        ) : (
          <div className="flex items-center justify-between gap-3">
            <button
              onClick={onBack}
              aria-label="Back to results"
              className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#0e0f0c] active:bg-[#1633001f]"
            >
              <ChevronLeft size={20} strokeWidth={2.5} />
            </button>
            <span className="text-base font-bold text-[#0e0f0c]">Match details</span>
            <button
              onClick={startEdit}
              aria-label="Edit match"
              className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#454745] active:bg-[#1633001f]"
            >
              <Pencil size={20} />
            </button>
          </div>
        )}

        <Segmented tab={tab} setTab={setTab} />

        {tab === "match" && (
          <LiveScore
            live={view}
            teamName={teamName}
            us={us}
            them={them}
            locked={!editable}
            showSwap={editable}
            plusDisabled={false}
            nameBtnLabel="Change name"
            onSwap={toggleHome}
            onNameTap={openOpp}
            onOurGoal={() => setGoalEditor({})}
            onOppGoal={addOppGoal}
          />
        )}
      </div>

      {tab === "match" ? (
        <div className="space-y-4">
          <GoalFeed
            events={view.events}
            nameOf={nameOf}
            teamName={teamName}
            home={view.home}
            heading={false}
            locked={!editable}
            onEdit={(e) => setGoalEditor({ eventId: e.id })}
            onDelete={(e) => setConfirmDelEvt(e)}
          />
          {view.events.length === 0 && (
            <p className="rounded-3xl bg-[#16330014] p-4 text-sm text-[#454745]">
              No goals recorded.
            </p>
          )}
          {editable && (
            <button
              onClick={() => setConfirmDelMatch(true)}
              className="h-11 w-full rounded-full bg-[#16330014] text-base font-bold text-[#454745] active:bg-[#1633001f]"
            >
              Delete match
            </button>
          )}
        </div>
      ) : (
        <LineUpTab
          players={lineUp}
          isPlaying={isPlaying}
          onToggle={onToggle}
          goalsOf={goalsOf}
          assistsOf={assistsOf}
          locked={!editable}
        />
      )}

      {confirmClose && (
        <Modal
          title="Discard changes?"
          body="Your edits to this match won't be saved."
          confirmLabel="Discard"
          danger
          onCancel={() => setConfirmClose(false)}
          onConfirm={exitEdit}
        />
      )}
      {confirmSave && (
        <Modal
          title="Save changes?"
          body={`This updates the result to ${s.l} ${s.ls} – ${s.rs} ${s.r} and your season totals.`}
          confirmLabel="Save"
          onCancel={() => setConfirmSave(false)}
          onConfirm={commit}
        />
      )}
      {confirmDelEvt && (
        <Modal
          title={
            confirmDelEvt.type === "halftime"
              ? "Remove the half-time marker?"
              : "Remove this opposition goal?"
          }
          body="This can't be undone."
          confirmLabel="Remove"
          danger
          onCancel={() => setConfirmDelEvt(null)}
          onConfirm={() => {
            deleteEvent(confirmDelEvt.id);
            setConfirmDelEvt(null);
          }}
        />
      )}
      {confirmDelMatch && (
        <Modal
          title="Delete this match?"
          body="It's removed from your season and totals. This can't be undone."
          confirmLabel="Delete"
          danger
          onCancel={() => setConfirmDelMatch(false)}
          onConfirm={() => {
            setData((d) => ({ ...d, matches: d.matches.filter((m) => m.id !== match.id) }));
            flash("Match deleted");
            onBack();
          }}
        />
      )}
      {oppSheet && (
        <div
          className="fixed inset-0 z-50 flex items-end justify-center p-4 sm:items-center"
          style={{ backgroundColor: "rgba(15,23,42,0.45)" }}
        >
          <div className="w-full max-w-sm rounded-2xl bg-white p-5 shadow-xl">
            <h3 className="text-base font-semibold text-slate-900">Opposition name</h3>
            <input
              autoFocus
              value={oppDraft}
              onChange={(e) => setOppDraft(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && saveOpp()}
              placeholder="e.g. Riverside FC"
              className="mt-3 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-[#163300]"
            />
            <div className="mt-4 flex flex-col gap-2">
              <button
                onClick={saveOpp}
                className="w-full rounded-xl bg-[#163300] py-2.5 text-sm font-semibold text-white active:bg-black"
              >
                Save
              </button>
              <button
                onClick={() => setOppSheet(false)}
                className="w-full rounded-xl border border-slate-200 py-2.5 text-sm font-medium text-slate-700 active:bg-slate-50"
              >
                Cancel
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

                {(e.scorerId || e.assistId) && (
                  <div className="mt-1 flex flex-wrap gap-x-3 text-base">
                    {e.scorerId && (
                      <span>
                        <span className="font-bold text-[#0e0f0c]">G: </span>
                        <span className="font-light text-[#0e0f0c]">{nameOf(e.scorerId)}</span>

            </span>

function SaveGoalScreen({ players, initial, onSave, onDiscard }) {
  const [step, setStep] = useState("scorer");
  const [scorerId, setScorerId] = useState(initial ? initial.scorerId : null);
  const [assistId, setAssistId] = useState(initial ? initial.assistId : null);
  const [confirmTrash, setConfirmTrash] = useState(false);
  const editing = !!initial;

  const title = step === "scorer" ? "Goalscorer" : "Assist";
  const selectedId = step === "scorer" ? scorerId : assistId;
  const pick = (pid) => {
    if (step === "scorer") setScorerId((c) => (c === pid ? null : pid));
    else setAssistId((c) => (c === pid ? null : pid));
  };
  const iconBtn =
    "flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#0e0f0c] active:bg-[#1633001f] disabled:pointer-events-none disabled:opacity-40";

  return (
    <div className="fixed inset-0 z-40 flex flex-col bg-white">
      <div className="border-b border-black/[0.06] bg-white/80 backdrop-blur-xl">
        <div className="mx-auto flex max-w-md items-center justify-between px-6 pb-2 pt-6">
          <button
            onClick={() => setConfirmTrash(true)}
            aria-label={editing ? "Delete goal" : "Discard goal"}
            className={iconBtn}
          >
            <Trash2 size={20} />
          </button>
          <span className="text-base font-bold text-[#0e0f0c]">Goal!</span>
          <button
            onClick={() => onSave({ scorerId, assistId })}
            aria-label="Save goal"
            className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#9fe870] text-[#163300] active:bg-[#8fd95f]"
          >
            <Check size={20} strokeWidth={2.5} />
          </button>
        </div>
      </div>

      <div className="mx-auto w-full max-w-md flex-1 overflow-y-auto px-6 pb-28 pt-2">
        <div className="flex items-center justify-between">
          <button
            onClick={() => setStep("scorer")}
            disabled={step === "scorer"}
            aria-label="Goalscorer"
            className={iconBtn}
          >
            <ChevronLeft size={20} />
          </button>
          <h1 className="text-[34px] font-bold leading-none tracking-tight text-[#0e0f0c]">
            {title}
          </h1>
          <button
            onClick={() => setStep("assist")}
            disabled={step === "assist"}
            aria-label="Assist"
            className={iconBtn}
          >
            <ChevronRight size={20} />
          </button>
        </div>

        <div className="mt-4 space-y-4">
          {players.length === 0 ? (
            <p className="rounded-3xl bg-[#16330014] p-4 text-sm text-[#454745]">
              No players in the line-up.
            </p>
          ) : (
            players.map((p) => {
              const selected = selectedId === p.id;
              return (
                <button
                  key={p.id}
                  onClick={() => pick(p.id)}
                  className={
                    "flex w-full items-center rounded-3xl p-4 text-left text-base font-bold text-[#0e0f0c] transition-colors " +
                    (selected ? "bg-[#9fe870]" : "bg-[#16330014] active:bg-[#1633001f]")
                  }
                >
                  {p.name}
                </button>
              );
            })
          )}
        </div>
      </div>

      {confirmTrash && (
        <Modal
          title={editing ? "Delete this goal?" : "Discard this goal?"}
          body={
            editing
              ? "It's removed from the feed and the score. This can't be undone."
              : "You'll lose the goalscorer and assist you've picked."
          }
          confirmLabel={editing ? "Delete" : "Discard"}
          danger
          onCancel={() => setConfirmTrash(false)}
          onConfirm={() => {
            setConfirmTrash(false);
            onDiscard();
          }}
        />
      )}
    </div>
  );
}

function Live({ data, setData, roster, teamName, setTab, flash }) {
  const [liveTab, setLiveTab] = useState("match");
  const [oppSheet, setOppSheet] = useState(false);
  const [oppDraft, setOppDraft] = useState("");
  const [goalEditor, setGoalEditor] = useState(null);
  const [confirmEnd, setConfirmEnd] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const { live } = data;

  const nameOf = (id) => (roster.find((p) => p.id === id) || {}).name || "—";

  useEffect(() => {
    if (data.live) return;
    setData((d) =>
      d.live
        ? d
        : {
            ...d,
            live: {
              date: today(),
              opposition: "",
              home: true,
              active: false,
              playing: Object.fromEntries(
                d.roster.filter((p) => p.active).map((p) => [p.id, true])
              ),
              events: [],
            },
          }
    );
  }, []);

  if (!live) {
    return (
      <div className="flex min-h-96 items-center justify-center text-sm text-[#454745]">
        Setting up…
      </div>
    );
  }

  const updLive = (fn) => setData((d) => ({ ...d, live: fn(d.live) }));

  const teamEvents = live.events.filter((e) => e.type === "team");
  const oppEvents = live.events.filter((e) => e.type === "opp");
  const us = teamEvents.length;
  const them = oppEvents.length;
  const s = sides(teamName, live.opposition, us, them, live.home);

  const goalsOf = (pid) => teamEvents.filter((e) => e.scorerId === pid).length;
  const assistsOf = (pid) => teamEvents.filter((e) => e.assistId === pid).length;

  const toggleHome = () => updLive((l) => ({ ...l, home: !l.home }));
  const isPlaying = (pid) => live.playing?.[pid] !== false;
  const onToggle = (p) =>
    updLive((l) => ({ ...l, playing: { ...l.playing, [p.id]: !isPlaying(p.id) } }));

  const openOpp = () => {
    setOppDraft(live.opposition || "");
    setOppSheet(true);
  };
  const saveOpp = () => {
    updLive((l) => ({ ...l, opposition: oppDraft.trim() }));
    setOppSheet(false);
  };

  const halftimeMarker = live.events.find((e) => e.type === "halftime");

  const startGame = () =>
    updLive((l) => ({
      ...l,
      active: true,
      opposition: l.opposition.trim() || "Opposition",
    }));
  const addOurGoal = () => setGoalEditor({});
  const addOppGoal = () =>
    updLive((l) => ({ ...l, events: [...l.events, { id: uid(), type: "opp" }] }));
  const addHalftime = () =>
    updLive((l) => ({
      ...l,
      events: [...l.events, { id: uid(), type: "halftime", us, them }],
    }));
  const deleteEvent = (id) =>
    updLive((l) => ({ ...l, events: l.events.filter((e) => e.id !== id) }));
  const saveGoalEvent = ({ scorerId, assistId }) => {
    const editId = goalEditor && goalEditor.eventId;
    updLive((l) => ({
      ...l,
      events: editId
        ? l.events.map((e) => (e.id === editId ? { ...e, scorerId, assistId } : e))
        : [...l.events, { id: uid(), type: "team", scorerId, assistId }],
    }));
    setGoalEditor(null);
  };

  const lineUp = roster.filter((p) => p.active);
  const appeared = (pid) =>
    isPlaying(pid) || teamEvents.some((e) => e.scorerId === pid || e.assistId === pid);

  const end = () => {
    const goals = {};
    const assists = {};
    teamEvents.forEach((e) => {
      if (e.scorerId) goals[e.scorerId] = (goals[e.scorerId] || 0) + 1;
      if (e.assistId) assists[e.assistId] = (assists[e.assistId] || 0) + 1;
    });
    const record = {
      id: uid(),
      date: live.date,
      opposition: live.opposition.trim(),
      home: live.home,
      goals,
      assists,
      oppGoals: them,
      appearances: lineUp.filter((p) => appeared(p.id)).map((p) => p.id),
      events: live.events,
    };
    setData((d) => ({ ...d, matches: [record, ...d.matches], live: null }));
    setConfirmEnd(false);
    flash("Match saved to your season");
    setTab("matches");
  };
  const discard = () => {
    setData((d) => ({ ...d, live: null }));
    setConfirmEnd(false);
    flash("Match discarded");
  };

  const matchBtn = !live.active
    ? { label: "Start game", onClick: startGame }
    : halftimeMarker
    ? { label: "Full-time", onClick: () => setConfirmEnd(true) }
    : { label: "Half-time", onClick: addHalftime };

  if (goalEditor) {
    const initial = goalEditor.eventId
      ? live.events.find((e) => e.id === goalEditor.eventId)
      : null;
    const pickPlayers = lineUp.filter(
      (p) =>
        isPlaying(p.id) ||
        (initial && (initial.scorerId === p.id || initial.assistId === p.id))
    );
    return (
      <SaveGoalScreen
        players={pickPlayers}
        initial={initial}
        onSave={saveGoalEvent}
        onDiscard={() => {
          if (goalEditor.eventId) deleteEvent(goalEditor.eventId);
          setGoalEditor(null);
        }}
      />
    );
  }

  return (
    <div>
      <div className="sticky top-0 z-20 -mx-4 -mt-6 mb-4 space-y-4 border-b border-black/[0.06] bg-white/85 px-4 pb-4 pt-6 backdrop-blur-xl">
        <Segmented tab={liveTab} setTab={setLiveTab} />
        {liveTab === "match" && (
          <LiveScore
            live={live}
            teamName={teamName}
            us={us}
            them={them}
            onSwap={toggleHome}
            onNameTap={openOpp}
            onOurGoal={addOurGoal}
            onOppGoal={addOppGoal}
            showSwap={!live.active}
            plusDisabled={!live.active}
          />
        )}
      </div>

      {liveTab === "match" ? (
        <div className="space-y-4">
          <button
            onClick={matchBtn.onClick}
            className="w-full rounded-full bg-[#16330014] py-3 text-base font-bold text-[#454745] active:bg-[#1633001f]"
          >
            {matchBtn.label}
          </button>

          {live.active && (
            <GoalFeed
              events={live.events}
              nameOf={nameOf}
              teamName={teamName}
              home={live.home}
              onEdit={(e) => setGoalEditor({ eventId: e.id })}
              onDelete={(e) => setConfirmDelete(e)}
            />
          )}
        </div>
      ) : (
        <LineUpTab
          players={lineUp}
          isPlaying={isPlaying}
          onToggle={onToggle}
          goalsOf={goalsOf}
          assistsOf={assistsOf}
        />
      )}

      {confirmEnd && (
        <Modal
          title="Full-time — save this match?"
          body={`Final score ${s.l} ${s.ls} – ${s.rs} ${s.r}. Saving adds it to your season and updates the totals. Discard throws it away.`}
          confirmLabel="Save to season"
          secondaryLabel="Discard match"
          onConfirm={end}
          onSecondary={discard}
          onCancel={() => setConfirmEnd(false)}
        />
      )}

      {confirmDelete && (
        <Modal
          title={
            confirmDelete.type === "halftime"
              ? "Remove the half-time marker?"
              : "Remove this opposition goal?"
          }
          body={
            confirmDelete.type === "halftime"
              ? "The half-time button goes back to Half-time."
              : "It comes off the away score. This can't be undone."
          }
          confirmLabel="Remove"
          danger
          onCancel={() => setConfirmDelete(null)}
          onConfirm={() => {
            deleteEvent(confirmDelete.id);
            setConfirmDelete(null);
          }}
        />
      )}

      {oppSheet && (
        <div className="fixed inset-0 z-50 flex items-end justify-center p-4 sm:items-center" style={{ backgroundColor: "rgba(15,23,42,0.45)" }}>
          <div className="w-full max-w-sm rounded-2xl bg-white p-5 shadow-xl">
            <h3 className="text-base font-semibold text-slate-900">Opposition name</h3>
            <input
              autoFocus
              value={oppDraft}
              onChange={(e) => setOppDraft(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && saveOpp()}
              placeholder="e.g. Riverside FC"
              className="mt-3 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-[#163300]"
            />
            <div className="mt-4 flex flex-col gap-2">
              <button
                onClick={saveOpp}
                className="w-full rounded-xl bg-[#163300] py-2.5 text-sm font-semibold text-white active:bg-black"
              >
                Save
              </button>
              <button
                onClick={() => setOppSheet(false)}
                className="w-full rounded-xl border border-slate-200 py-2.5 text-sm font-medium text-slate-700 active:bg-slate-50"
              >
                Cancel
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ScoreSide({ label, score, ours, teamName, opposition, onNameTap }) {
  return (
    <div className="flex min-w-0 flex-1 flex-col items-center gap-1 text-center">
      <div className="text-base font-light text-white">{label}</div>
      <div className="text-[34px] font-bold leading-none tabular-nums text-white">{score}</div>
      {ours ? (
        <div className="max-w-full truncate px-2 py-1 text-base font-bold text-white">
          {teamName.trim() || "Team"}
        </div>
      ) : (
        <button
          onClick={onNameTap}
          className="max-w-full truncate rounded-full bg-[#e2f6d5] px-3 py-1 text-base font-bold text-[#163300] active:bg-[#d3efc0]"
        >
          {opposition || "Add name"}
        </button>
      )}
    </div>
  );
}

function Empty({ icon, title, body }) {
  return (
    <div className="mt-10 flex flex-col items-center text-center">
      <div className="flex h-14 w-14 items-center justify-center rounded-2xl bg-slate-100 text-slate-400">
        {icon}
      </div>
      <h3 className="mt-4 font-semibold">{title}</h3>
      <p className="mt-1 max-w-xs text-sm text-slate-500">{body}</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
