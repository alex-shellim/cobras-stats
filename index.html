// The live match moved from goal/assist count maps to an event feed.
// Migrate any doc still on the old shape so older sessions keep working.
const normalizeLive = (l) => {
  if (!l) return null;
  if (Array.isArray(l.events))
    return {
      active: l.active !== false,
      ready: l.active !== false,
      format: "halves",
      type: null,
      tournament: "",
      ...l,
    };
  const events = [];
  Object.entries(l.goals || {}).forEach(([pid, n]) => {
    for (let i = 0; i < n; i++)
      events.push({ id: uid(), type: "team", scorerId: pid, assistId: null });
  });
  for (let i = 0; i < (l.oppGoals || 0); i++) events.push({ id: uid(), type: "opp" });
  return {
    date: l.date || today(),
    opposition: l.opposition || "",
    home: l.home !== false,
    format: l.format !== undefined ? l.format : "halves",
    type: l.type || null,
    tournament: l.tournament || "",
    playing: l.playing || {},
    active: true,
    ready: true,
    events,
  };
};

function fmtDate(iso, long = false) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const day = dt.toLocaleDateString("en-GB", { weekday: "short" });
  const mon = dt.toLocaleDateString("en-GB", { month: "short" });
  return long ? `${day} ${d} ${mon} ${y}` : `${day} ${d} ${mon}`;
}

const sum = (obj) => Object.values(obj || {}).reduce((a, b) => a + (b || 0), 0);
const ourScore = (m) => sum(m.goals);
const stripZeros = (obj) =>

// home/away aware sides for display: l/r names, ls/rs scores
function sides(teamName, opposition, us, them, home) {
  const opp = opposition || "Opposition";
  return home
    ? { l: teamName, ls: us, r: opp, rs: them, home: true }
    : { l: opp, ls: them, r: teamName, rs: us, home: false };
}

  const incPlain =

  return (
    <div className={"flex items-center gap-2" + (disabled ? " opacity-60" : "")}>

        onClick={onDec}

    "w-full rounded-xl border border-rose-200 py-2.5 text-sm font-semibold text-rose-600 active:bg-rose-50";

    <div className="fixed inset-0 z-50 flex items-end justify-center p-4 sm:items-center" style={{ backgroundColor: "rgba(15,23,42,0.45)" }}>

// ---------- App (Firestore-backed, shared in real time) ----------

function App() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("scorers");
  const [toast, setToast] = useState(null);
  const [banner, setBanner] = useState(docRef ? "" : "offline");
  const dirty = useRef(false);
  const dataRef = useRef(null);
  const writeTimer = useRef(null);
  const toastTimer = useRef(null);

  const writeNow = (next) => {
    if (!docRef) return;
    docRef.set(next)
      .then(() => setBanner((b) => (b === "save-error" ? "" : b)))
      .catch((err) => { console.error("Save failed:", err); setBanner("save-error"); })
      .finally(() => { dirty.current = false; });
  };

  useEffect(() => {
    if (!docRef) {
      const s = seed();
      dataRef.current = s;
      setData(s);
      return;
    }
    const unsub = docRef.onSnapshot(
      (snap) => {
        if (!snap.exists) {
          const s = seed();
          dataRef.current = s;
          setData(s);
          writeNow(s);
          return;
        }
        if (snap.metadata.hasPendingWrites) return; // our own optimistic write echoing back
        if (dirty.current) return;                  // don't clobber an in-progress edit
        const incoming = normalize(snap.data());
        if (JSON.stringify(incoming) === JSON.stringify(dataRef.current)) return;
        dataRef.current = incoming;
        setData(incoming);
      },
      (err) => { console.error("Read failed:", err); setBanner("read-error"); }
    );
    return unsub;
  }, []);

  // wrapped updater: local state now, debounced write to Firestore
  const update = (fnOrVal) => {
    setData((prev) => {
      const next = typeof fnOrVal === "function" ? fnOrVal(prev) : fnOrVal;
      dataRef.current = next;
      dirty.current = true;
      clearTimeout(writeTimer.current);
      writeTimer.current = setTimeout(() => writeNow(next), 600);
      return next;
    });
  };

  const flash = (msg, action) => {
    clearTimeout(toastTimer.current);
    setToast({ msg, action: action || null });
    toastTimer.current = setTimeout(() => setToast(null), action ? 5000 : 1800);
  };
  const dismissToast = () => {
    clearTimeout(toastTimer.current);
    setToast(null);
  };

  if (!data) {
    return (
      <div className="flex min-h-screen items-center justify-center bg-slate-50 text-sm text-slate-400">
        Loading…
      </div>
    );
  }

  const { roster, matches, live, teamName } = data;
  const nameOf = (id) => (roster.find((p) => p.id === id) || {}).name || "—";

  const appeared = (m, pid) =>
    (m.appearances || []).includes(pid) || (m.goals && m.goals[pid] > 0) || (m.assists && m.assists[pid] > 0);
  const stats = roster
    .filter((p) => p.active)
    .map((p) => ({
      ...p,
      games: matches.filter((m) => appeared(m, p.id)).length,
      goals: matches.reduce((a, m) => a + ((m.goals && m.goals[p.id]) || 0), 0),
      assists: matches.reduce((a, m) => a + ((m.assists && m.assists[p.id]) || 0), 0),
      gold: matches.filter((m) => m.medals && m.medals.gold === p.id).length,
      silver: matches.filter((m) => m.medals && m.medals.silver === p.id).length,
      bronze: matches.filter((m) => m.medals && m.medals.bronze === p.id).length,
    }));

  const bannerText = {
    offline: "Not connected to a database — add your Firebase config to save. Changes now are temporary.",
    "save-error": "Couldn't save — check your Firestore rules allow writes to season/current.",
    "read-error": "Couldn't reach the database — check your config and rules."
  };

  return (
    <div className="min-h-screen bg-white text-slate-900">
      <div className="mx-auto flex min-h-screen max-w-md flex-col">
        {banner && (
          <div className={"px-4 py-2 text-center text-xs font-medium " + (banner === "offline" ? "bg-amber-100 text-amber-800" : "bg-rose-100 text-rose-800")}>
            {bannerText[banner]}
          </div>
        )}
        <main className="flex-1 px-6 pb-28 pt-6">
          {tab === "scorers" && (<Scorers stats={stats} setData={update} roster={roster} teamName={teamName} flash={flash} />)}
          {tab === "matches" && (<Matches data={data} setData={update} nameOf={nameOf} roster={roster} teamName={teamName} flash={flash} />)}
          {tab === "live" && (<Live data={data} setData={update} roster={roster} teamName={teamName} setTab={setTab} flash={flash} />)}
        </main>

        {toast && (
          <div className="pointer-events-none fixed inset-x-0 bottom-24 z-40 flex justify-center px-4">
            <div className="pointer-events-auto flex items-center gap-3 rounded-full bg-slate-900 py-2 pl-4 pr-2 text-sm font-medium text-white shadow-lg">
              <span>{toast.msg}</span>
              {toast.action && (
                <button
                  onClick={() => {
                    toast.action.onClick();
                    dismissToast();
                  }}
                  className="rounded-full bg-white/15 px-3 py-1 text-sm font-semibold text-white active:bg-white/25"
                >
                  {toast.action.label}
                </button>
              )}
            </div>
          </div>
        )}

        {/* Blurred scrim so content is obscured as it scrolls under the nav */}
        <div className="glass-scrim pointer-events-none fixed inset-x-0 bottom-0 z-20 h-28 bg-white/55 [mask-image:linear-gradient(to_top,black_65%,transparent)] [-webkit-mask-image:linear-gradient(to_top,black_65%,transparent)]" />

        <nav className="fixed inset-x-0 bottom-0 z-30 mx-auto flex max-w-md items-center gap-3 px-5 pb-6 pt-3">
          <div className="flex flex-1 items-center gap-1 rounded-[26px] border border-white/70 bg-white/70 p-1.5 shadow-lg shadow-black/5 backdrop-blur-xl">
            {[
              { id: "scorers", label: "Team", Icon: UsersGlyph },
              { id: "matches", label: "Results", Icon: CalendarGlyph }
            ].map(({ id, label, Icon }) => {
              const on = tab === id;
              return (
                <button
                  key={id}
                  onClick={() => setTab(id)}
                  className={
                    "flex flex-1 items-center justify-center gap-2 rounded-[20px] px-3 py-2.5 text-sm font-bold transition-colors " +
                    (on ? "bg-[#0e0f0c] text-white" : "text-[#454745] active:bg-black/5")
                  }
                >
                  <Icon size={20} strokeWidth={on ? 2.4 : 2} />
                  {label}
                </button>
              );
            })}
          </div>
          <button
            onClick={() => setTab("live")}
            aria-label="Live match"
            className={
              "relative flex h-[52px] w-[52px] shrink-0 items-center justify-center rounded-full border border-white/70 shadow-lg shadow-black/5 backdrop-blur-xl transition-colors " +
              (tab === "live" ? "bg-[#0e0f0c] text-white" : "bg-white/70 text-[#0e0f0c]")
            }
          >
            <SoccerballGlyph size={26} />
            {live && live.active && (
              <span className="absolute -right-0.5 -top-0.5 h-3 w-3 rounded-full bg-rose-500 ring-2 ring-white" />
            )}
          </button>
        </nav>
      </div>
    </div>
  );
}

function StatRow({ cells }) {

    <div className="flex gap-1 rounded-lg bg-[#16330014] px-1 py-2">
      {cells.map(([label, value], i) => (
        <React.Fragment key={label}>
          {i > 0 && <div className="w-px shrink-0 bg-black/20" />}
          <div className="flex flex-1 items-center justify-center gap-0.5 whitespace-nowrap text-base text-[#0e0f0c]">
            <span className="font-light">{label}</span>
            <span className="font-bold">{value}</span>
          </div>
        </React.Fragment>
      ))}

}

function PlayerCard({ p }) {
  return (
    <div className="flex flex-col gap-2 rounded-2xl bg-[#16330014] p-4">
      <p className="truncate text-2xl font-bold text-[#0e0f0c]">{p.name}</p>
      <StatRow cells={[["P:", p.games], ["G:", p.goals], ["A:", p.assists], ["G/A:", p.goals + p.assists]]} />
      <StatRow cells={[["🥇", p.gold], ["🥈", p.silver], ["🥉", p.bronze]]} />

const SORT_OPTIONS = [
  { key: "games", label: "Played", value: (p) => p.games },
  { key: "goals", label: "Goals", value: (p) => p.goals },
  { key: "assists", label: "Assists", value: (p) => p.assists },
  { key: "ga", label: "G+A", value: (p) => p.goals + p.assists },
  { key: "medals", label: "Medals", value: (p) => p.gold * 3 + p.silver * 2 + p.bronze },
];

function Scorers({ stats, setData, roster, teamName, flash }) {
  const [manage, setManage] = useState(false);
  const [name, setName] = useState("");
  const [remove, setRemove] = useState(null);
  const [deleteTeam, setDeleteTeam] = useState(false);
  const [draft, setDraft] = useState(null);
  const [confirmClose, setConfirmClose] = useState(false);
  const [confirmSave, setConfirmSave] = useState(false);
  const [sortBy, setSortBy] = useState("goals");
  const [fading, setFading] = useState(false);
  const fadeTimer = useRef(null);
  const baseRef = useRef(null);
  const squad = roster.filter((p) => p.active);
  const draftSquad = draft ? draft.roster.filter((p) => p.active) : [];

  const sortValue = SORT_OPTIONS.find((o) => o.key === sortBy).value;
  const sortedStats = useMemo(
    () => [...stats].sort((a, b) => sortValue(b) - sortValue(a) || a.name.localeCompare(b.name)),
    [stats, sortBy]
  );

  const changeSort = (key) => {
    if (key === sortBy) return;
    clearTimeout(fadeTimer.current);
    setFading(true);
    fadeTimer.current = setTimeout(() => {
      setSortBy(key);
      setFading(false);
    }, 150);
  };

  const openManage = () => {
    const d = {
      teamName,
      roster: roster.map((p) => ({ ...p })),
    };
    baseRef.current = JSON.stringify(d);
    setDraft(d);
    setName("");
    setManage(true);
  };
  const dirty = () => draft && JSON.stringify(draft) !== baseRef.current;
  const exitManage = () => {
    setDraft(null);
    setManage(false);
    setConfirmClose(false);
    setConfirmSave(false);
    setName("");
  };
  const commit = () => {
    setData((d) => ({
      ...d,
      teamName: draft.teamName,
      roster: draft.roster,
    }));
    exitManage();
    flash("Changes saved");
  };
  const tryClose = () => (dirty() ? setConfirmClose(true) : exitManage());
  const trySave = () => (dirty() ? setConfirmSave(true) : exitManage());

  const addPlayer = () => {
    const n = name.trim();
    if (!n) return;
    setDraft((d) => ({ ...d, roster: [...d.roster, { id: uid(), name: n, active: true }] }));
    setName("");
  };
  const rename = (id, value) =>
    setDraft((d) => ({
      ...d,
      roster: d.roster.map((p) => (p.id === id ? { ...p, name: value } : p)),
    }));

  return (
    <div>
      <StickyHeader>
        <div className="flex items-center gap-4">
          <h1 className="flex-1 truncate text-[34px] font-bold leading-none tracking-tight text-[#0e0f0c]">
            {teamName.trim() || "Team"}
          </h1>
          <button
            onClick={openManage}
            aria-label="Edit team"
            className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#454745] active:bg-[#1633001f]"
          >
            <Pencil size={20} />
          </button>
        </div>
      </StickyHeader>

      {manage ? (
        <div className="fixed inset-0 z-40 flex flex-col bg-white">
          <div className="border-b border-black/[0.06] bg-white/80 backdrop-blur-xl">
            <div className="mx-auto flex max-w-md items-center justify-between px-6 pb-2 pt-6">
              <button
                onClick={tryClose}
                aria-label="Close"
                className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#0e0f0c] active:bg-[#1633001f]"
              >
                <X size={20} strokeWidth={2.5} />
              </button>
              <span className="text-base font-bold text-[#0e0f0c]">Edit team</span>
              <button
                onClick={trySave}
                aria-label="Done"
                className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#9fe870] text-[#163300] active:bg-[#8fd95f]"
              >
                <Check size={20} strokeWidth={2.5} />
              </button>
            </div>
          </div>

          <div className="mx-auto w-full max-w-md flex-1 overflow-y-auto px-6 pb-28 pt-4">
            <div className="flex flex-col gap-6">
              <div className="flex flex-col gap-2">
                <label className="text-base font-bold text-black">Team name</label>
                <input
                  value={draft ? draft.teamName : ""}
                  onChange={(e) => setDraft((d) => ({ ...d, teamName: e.target.value }))}
                  className="h-11 w-full rounded-lg border border-[#0e0f0c33] px-3 text-base text-[#0e0f0c] outline-none focus:border-[#0e0f0c]"
                />
              </div>

              <div className="flex flex-col gap-4">
                <label className="text-base font-bold text-black">Players</label>
                {draftSquad.length === 0 ? (
                  <p className="text-sm text-[#454745]">No players yet. Add one below.</p>
                ) : (
                  draftSquad.map((p) => (
                    <div key={p.id} className="flex items-center gap-2">
                      <input
                        value={p.name}
                        onChange={(e) => rename(p.id, e.target.value)}
                        className="h-11 min-w-0 flex-1 rounded-lg border border-[#0e0f0c33] px-3 text-base text-[#0e0f0c] outline-none focus:border-[#0e0f0c]"
                      />
                      <button
                        onClick={() => setRemove(p)}
                        aria-label={`Remove ${p.name}`}
                        className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#454745] active:bg-[#1633001f]"
                      >
                        <Trash2 size={20} />
                      </button>
                    </div>
                  ))
                )}
              </div>

              <div className="flex flex-col gap-2">
                <label className="text-base font-bold text-black">Add player</label>
                <div className="flex items-center gap-2">
                  <input
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && addPlayer()}
                    placeholder="New player"
                    className="h-11 min-w-0 flex-1 rounded-lg border border-[#0e0f0c33] px-3 text-base text-[#0e0f0c] outline-none placeholder:text-[#0e0f0c66] focus:border-[#0e0f0c]"
                  />
                  <button
                    onClick={addPlayer}
                    aria-label="Add player"
                    className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#454745] active:bg-[#1633001f]"
                  >
                    <Plus size={20} strokeWidth={2.5} />
                  </button>
                </div>
              </div>

              <button
                onClick={() => setDeleteTeam(true)}
                className="h-11 w-full rounded-full bg-[#16330014] text-base font-bold text-[#454745] active:bg-[#1633001f]"
              >
                Delete team
              </button>
            </div>
          </div>
        </div>
      ) : squad.length === 0 ? (
        <Empty
          icon={<Users size={26} />}
          title="Build your squad"
          body="Tap the edit button above to name your team and add players. Their goals and assists show up here."
        />
      ) : (
        <div className="mt-6 flex flex-col gap-4">
          <div className="-mx-6 flex gap-2 overflow-x-auto px-6 pb-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
            {SORT_OPTIONS.map((o) => (
              <button
                key={o.key}
                onClick={() => changeSort(o.key)}
                className={
                  "flex h-7 shrink-0 items-center justify-center whitespace-nowrap rounded-full px-4 text-base font-bold " +
                  (sortBy === o.key
                    ? "bg-[#9fe870] text-[#163300]"
                    : "bg-[#16330014] text-[#454745] active:bg-[#1633001f]")
                }
              >
                {o.label}
              </button>
            ))}
          </div>

          <div
            className={
              "flex flex-col gap-4 transition-opacity duration-150 ease-in-out " +
              (fading ? "opacity-0" : "opacity-100")
            }
          >
            {sortedStats.map((p) => (
              <PlayerCard key={p.id} p={p} />
            ))}
          </div>
        </div>
      )}

      {remove && (
        <Modal
          title={`Remove ${remove.name}?`}
          body="They'll be taken off the squad list. Their goals and assists in past matches stay recorded. Nothing is saved until you tap the tick."
          confirmLabel="Remove"
          danger
          onCancel={() => setRemove(null)}
          onConfirm={() => {
            const removed = remove;
            setDraft((d) => ({
              ...d,
              roster: d.roster.map((r) => (r.id === removed.id ? { ...r, active: false } : r)),
            }));
            setRemove(null);
          }}
        />
      )}

      {confirmClose && (
        <Modal
          title="Discard changes?"
          body="Your changes to the team won't be saved."
          confirmLabel="Discard"
          danger
          onCancel={() => setConfirmClose(false)}
          onConfirm={exitManage}
        />
      )}

      {confirmSave && (
        <Modal
          title="Save changes?"
          body="This updates your team name, club and squad for everyone."
          confirmLabel="Save"
          onCancel={() => setConfirmSave(false)}
          onConfirm={commit}
        />
      )}

      {deleteTeam && (
        <DeleteTeamModal
          onCancel={() => setDeleteTeam(false)}
          onConfirm={() => {
            setData(() => ({ teamName: "", roster: [], matches: [], live: null }));
            setDeleteTeam(false);
            setDraft(null);
            setManage(false);
            flash("Team deleted — add a new team to start");
          }}
        />
      )}
    </div>
  );
}

const RESULT_FILTERS = [
  { key: "all", label: "All" },
  { key: "league", label: "League" },
  { key: "tournament", label: "Tournament" },
  { key: "friendly", label: "Friendly" },
];

function MatchRow({ m, onClick }) {

  const home = m.home ?? true;
  return (
    <button
      onClick={onClick}
      className="relative flex w-full items-start gap-2 rounded-3xl bg-[#16330014] py-4 pl-4 pr-14 text-left active:bg-[#1633001f]"
    >
      <ResultBadge us={us} them={them} />
      <div className="min-w-0 flex-1">
        {m.type && (
          <span className="inline-block whitespace-nowrap rounded-full bg-black/[0.06] px-3 py-0.5 text-sm font-bold capitalize text-[#454745]">
            {m.type}
          </span>
        )}
        <div className="mt-1 truncate text-base font-bold leading-tight text-[#0e0f0c]">
          {us}–{them} vs {m.opposition || "Opposition"}
        </div>
        <div className="mt-1 truncate text-sm font-light leading-tight text-[#454745]">

function TournamentSummary({ name, date, format, matches, medals, nameOf, onBack, onEdit, onOpenMatch, flash }) {

        <div className="flex items-center justify-between">
          <button
            onClick={onBack}
            aria-label="Back to results"
            className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#0e0f0c] active:bg-[#1633001f]"
          >
            <ChevronLeft size={20} strokeWidth={2.5} />
          </button>
          <span className="text-base font-bold text-[#0e0f0c]">Tournament details</span>
          <button
            onClick={onEdit}
            aria-label="Edit tournament"
            className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#454745] active:bg-[#1633001f]"

            <Pencil size={20} />

function Matches({ data, setData, nameOf, roster, teamName, flash }) {
  const [openId, setOpenId] = useState(null);
  const [filter, setFilter] = useState("all");
  const [openTournament, setOpenTournament] = useState(null);
  const [editTournament, setEditTournament] = useState(null);
  const { matches, tournament, tournamentMedals } = data;
  const match = matches.find((m) => m.id === openId);

  if (match) {
    return (
      <MatchDetail
        match={match}
        setData={setData}
        nameOf={nameOf}
        roster={roster}
        teamName={teamName}
        onBack={() => setOpenId(null)}
        flash={flash}
      />
    );
  }

  if (editTournament) {
    const groupMatches = matches.filter((m) => m.tournament === editTournament);
    const currentDate =
      tournament && tournament.name === editTournament ? tournament.date : groupMatches[0]?.date;
    return (
      <EditTournament
        name={editTournament}
        date={currentDate}
        onCancel={() => setEditTournament(null)}
        onSave={({ name, date }) => {
          applyTournamentEdit(setData, editTournament, { name, date });
          setEditTournament(null);
          setOpenTournament((cur) => (cur === editTournament ? name : cur));
          flash("Tournament updated");
        }}
        onDelete={() => {
          applyTournamentDelete(setData, editTournament);
          setEditTournament(null);
          setOpenTournament(null);
          flash("Tournament deleted");
        }}
      />
    );
  }

  if (openTournament) {
    const groupMatches = matches.filter((m) => m.tournament === openTournament);
    const currentDate =
      tournament && tournament.name === openTournament ? tournament.date : groupMatches[0]?.date;
    const currentFormat =
      tournament && tournament.name === openTournament ? tournament.format : groupMatches[0]?.format;
    return (
      <TournamentSummary
        name={openTournament}
        date={currentDate}
        format={currentFormat}
        matches={groupMatches}
        medals={tournamentMedals[openTournament] || { gold: null, silver: null, bronze: null }}
        nameOf={nameOf}
        onBack={() => setOpenTournament(null)}
        onEdit={() => setEditTournament(openTournament)}
        onOpenMatch={setOpenId}
        flash={flash}
      />
    );
  }

  const sorted = [...matches].sort((a, b) => (a.date < b.date ? 1 : -1));
  const filtered =
    filter === "all"
      ? sorted
      : filter === "tournament"
      ? sorted.filter((m) => m.tournament)
      : sorted.filter((m) => m.type === filter);

  const summary = filtered.reduce(
    (acc, m) => {
      const us = ourScore(m);
      const them = m.oppGoals || 0;
      acc.p += 1;
      if (us > them) acc.w += 1;
      else if (us < them) acc.l += 1;
      else acc.d += 1;
      acc.f += us;
      acc.a += them;
      return acc;
    },
    { p: 0, w: 0, l: 0, d: 0, f: 0, a: 0 }
  );
  const gd = summary.f - summary.a;
  const gdLabel = gd > 0 ? `+${gd}` : `${gd}`;

  const items = [];
  const seenTournaments = new Set();
  filtered.forEach((m) => {
    if (m.tournament) {
      if (seenTournaments.has(m.tournament)) return;
      seenTournaments.add(m.tournament);
      items.push({
        kind: "group",
        name: m.tournament,
        date: m.date,
        matches: filtered.filter((x) => x.tournament === m.tournament),
      });
    } else {
      items.push({ kind: "match", match: m });
    }
  });

  return (
    <div>
      <StickyHeader>
        <div className="flex h-11 items-center">
          <h1 className="text-[34px] font-bold leading-none tracking-tight text-[#0e0f0c]">
            Results
          </h1>
        </div>
      </StickyHeader>

      {sorted.length === 0 ? (
        <Empty
          icon={<CalendarDays size={26} />}
          title="No results yet"
          body="Finish a match from the Live tab and it'll show up here."
        />
      ) : (
        <div className="mt-6 flex flex-col gap-4">
          <div className="-mx-6 flex gap-2 overflow-x-auto px-6 pb-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
            {RESULT_FILTERS.map((o) => (
              <button
                key={o.key}
                onClick={() => setFilter(o.key)}
                className={
                  "flex h-7 shrink-0 items-center justify-center whitespace-nowrap rounded-full px-4 text-base font-bold " +
                  (filter === o.key
                    ? "bg-[#9fe870] text-[#163300]"
                    : "bg-[#16330014] text-[#454745] active:bg-[#1633001f]")
                }
              >
                {o.label}
              </button>
            ))}
          </div>

          <div className="flex flex-col gap-2 rounded-2xl bg-[#16330014] p-4">
            <StatRow cells={[["P:", summary.p], ["W:", summary.w], ["L:", summary.l], ["D", summary.d]]} />
            <StatRow cells={[["F", summary.f], ["A", summary.a], ["+/-", gdLabel]]} />
          </div>

          {filtered.length === 0 ? (
            <p className="rounded-3xl bg-[#16330014] p-4 text-sm text-[#454745]">
              No {RESULT_FILTERS.find((o) => o.key === filter).label.toLowerCase()} matches yet.
            </p>
          ) : (
            <div className="flex flex-col gap-4">
              {items.map((item) => {
                if (item.kind === "match") {
                  return <MatchRow key={item.match.id} m={item.match} onClick={() => setOpenId(item.match.id)} />;
                }

                return (
                  <div key={item.name} className="overflow-hidden rounded-3xl bg-[#16330014]">
                    <button
                      onClick={() => setOpenTournament(item.name)}
                      className="relative flex w-full items-start justify-between gap-2 px-4 py-4 pr-14 text-left active:bg-[#1633001f]"
                    >
                      <div className="min-w-0">
                        <div className="truncate text-base font-bold text-[#0e0f0c]">
                          {item.name || "Tournament"}, {fmtDate(item.date)}
                        </div>
                        <div className="text-sm font-normal text-[#454745]">
                          {item.matches.length} match{item.matches.length === 1 ? "" : "es"}
                        </div>
                      </div>
                      <ChevronRight size={20} className="absolute right-4 top-4 shrink-0 text-[#454745]" />
                    </button>
                    <div className="divide-y divide-[#0e0f0c33] border-t border-[#0e0f0c33]">
                      {item.matches.map((m) => {
                        const us = ourScore(m);
                        const them = m.oppGoals || 0;
                        return (
                          <div key={m.id} className="flex w-full items-center gap-3 px-4 py-4">
                            <ResultBadge us={us} them={them} />
                            <span className="min-w-0 flex-1 truncate text-base font-bold text-[#0e0f0c]">
                              {us}–{them} vs {m.opposition || "Opposition"}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

    </div>
  );
}

function matchToEvents(m) {
  if (Array.isArray(m.events)) return m.events;
  const scorers = [];
  Object.entries(m.goals || {}).forEach(([pid, n]) => {
    for (let i = 0; i < n; i++) scorers.push(pid);
  });
  const assisters = [];
  Object.entries(m.assists || {}).forEach(([pid, n]) => {
    for (let i = 0; i < n; i++) assisters.push(pid);
  });
  const ev = scorers.map((pid, i) => ({
    id: uid(),
    type: "team",
    scorerId: pid,
    assistId: assisters[i] || null,
  }));
  for (let i = 0; i < (m.oppGoals || 0); i++) ev.push({ id: uid(), type: "opp" });
  return ev;
}

function MatchDetail({ match, setData, nameOf, roster, teamName, onBack, flash }) {
  const [mode, setMode] = useState("view");
  const [tab, setTab] = useState("match");
  const [draft, setDraft] = useState(null);
  const baseRef = useRef(null);
  const [goalEditor, setGoalEditor] = useState(null);
  const [confirmClose, setConfirmClose] = useState(false);
  const [confirmSave, setConfirmSave] = useState(false);
  const [goalMenu, setGoalMenu] = useState(null);
  const [confirmDelEvt, setConfirmDelEvt] = useState(null);
  const [confirmDelMatch, setConfirmDelMatch] = useState(false);
  const [medalEditor, setMedalEditor] = useState(false);

  const viewEvents = useMemo(() => matchToEvents(match), [match]);
  const editable = mode === "edit";
  const view = draft || {
    date: match.date,
    opposition: match.opposition || "",
    home: match.home ?? true,
    format: match.format !== undefined ? match.format : "halves",
    type: match.type || null,
    tournament: match.tournament || "",
    events: viewEvents,
    appearances: match.appearances || [],
    medals: match.medals || { gold: null, silver: null, bronze: null },
  };

  const teamEv = view.events.filter((e) => e.type === "team");
  const us = teamEv.length;
  const them = view.events.filter((e) => e.type === "opp").length;
  const s = sides(teamName, view.opposition, us, them, view.home);
  const lineUp = roster.filter(
    (p) =>
      p.active ||
      view.appearances.includes(p.id) ||
      teamEv.some((e) => e.scorerId === p.id || e.assistId === p.id)
  );
  const isPlaying = (pid) => view.appearances.includes(pid);
  const sortedLineUp = [...lineUp].sort((a, b) => a.name.localeCompare(b.name));
  const scoredIds = new Set();
  teamEv.forEach((e) => {
    if (e.scorerId) scoredIds.add(e.scorerId);
    if (e.assistId) scoredIds.add(e.assistId);
  });

  const startEdit = () => {
    const d = {
      date: match.date,
      opposition: match.opposition || "",
      home: match.home ?? true,
      format: match.format !== undefined ? match.format : "halves",
      type: match.type || null,
      tournament: match.tournament || "",
      events: viewEvents.map((e) => ({ ...e })),
      appearances: [...(match.appearances || [])],
      medals: { ...(match.medals || { gold: null, silver: null, bronze: null }) },
    };
    baseRef.current = JSON.stringify(d);
    setDraft(d);
    setMode("edit");
    setTab("match");
  };
  const dirty = () => draft && JSON.stringify(draft) !== baseRef.current;
  const exitEdit = () => {
    setDraft(null);
    setMode("view");
    setConfirmClose(false);
    setConfirmSave(false);
    setMedalEditor(false);
  };
  const commit = () => {
    const goals = {};
    const assists = {};
    draft.events
      .filter((e) => e.type === "team")
      .forEach((e) => {
        if (e.scorerId) goals[e.scorerId] = (goals[e.scorerId] || 0) + 1;
        if (e.assistId) assists[e.assistId] = (assists[e.assistId] || 0) + 1;
      });
    const updated = {
      ...match,
      date: draft.date,
      opposition: draft.opposition.trim(),
      home: draft.home,
      format: draft.format,
      type: draft.type || null,
      tournament: draft.type === "tournament" ? draft.tournament || "" : "",
      goals,
      assists,
      oppGoals: draft.events.filter((e) => e.type === "opp").length,
      appearances: draft.appearances,
      events: draft.events,
      medals: draft.medals,
    };
    setData((dd) => ({
      ...dd,
      matches: dd.matches.map((m) => (m.id === match.id ? updated : m)),
    }));
    exitEdit();
    flash("Match updated");
  };
  const tryClose = () => (dirty() ? setConfirmClose(true) : exitEdit());
  const trySave = () => (dirty() ? setConfirmSave(true) : exitEdit());

  const updDraft = (fn) => setDraft((d) => fn(d));
  const onToggle = (p) =>
    updDraft((d) => ({
      ...d,
      appearances: d.appearances.includes(p.id)
        ? d.appearances.filter((x) => x !== p.id)
        : [...d.appearances, p.id],
    }));
  const addOppGoal = () =>
    updDraft((d) => ({ ...d, events: [...d.events, { id: uid(), type: "opp" }] }));
  const deleteEvent = (id) =>
    updDraft((d) => ({ ...d, events: d.events.filter((e) => e.id !== id) }));
  const saveGoalEvent = ({ scorerId, assistId }) => {
    const editId = goalEditor && goalEditor.eventId;
    updDraft((d) => ({
      ...d,
      events: editId
        ? d.events.map((e) => (e.id === editId ? { ...e, scorerId, assistId } : e))
        : [...d.events, { id: uid(), type: "team", scorerId, assistId }],
    }));
    setGoalEditor(null);
  };
  if (goalEditor) {
    const initial = goalEditor.eventId
      ? view.events.find((e) => e.id === goalEditor.eventId)
      : null;
    const pick = lineUp.filter(
      (p) =>
        isPlaying(p.id) ||
        (initial && (initial.scorerId === p.id || initial.assistId === p.id))
    );
    return (
      <SaveGoalScreen
        players={pick.length ? pick : lineUp}
        initial={initial}
        onSave={saveGoalEvent}
        onClose={() => setGoalEditor(null)}
      />
    );
  }

  if (medalEditor) {
    return (
      <AwardMedalsScreen
        players={sortedLineUp}
        initial={draft.medals}
        onDone={(medals) => {
          updDraft((d) => ({ ...d, medals }));
          setMedalEditor(false);
        }}
        onCancel={() => setMedalEditor(false)}
      />
    );
  }

  return (
    <div>
      <div className="glass-scrim sticky top-0 z-20 -mx-6 -mt-6 mb-4 space-y-4 border-b border-black/[0.06] bg-white/65 px-6 pb-4 pt-6">
        {editable ? (
          <div className="flex items-center justify-between gap-3">
            <button
              onClick={tryClose}
              aria-label="Close"
              className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#0e0f0c] active:bg-[#1633001f]"
            >
              <X size={20} strokeWidth={2.5} />
            </button>
            <span className="text-base font-bold text-[#0e0f0c]">Edit match</span>
            <button
              onClick={trySave}
              aria-label="Save"
              className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#9fe870] text-[#163300] active:bg-[#8fd95f]"
            >
              <Check size={20} strokeWidth={2.5} />
            </button>
          </div>
        ) : (
          <div className="flex items-center justify-between gap-3">
            <button
              onClick={onBack}
              aria-label="Back to results"
              className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#0e0f0c] active:bg-[#1633001f]"
            >
              <ChevronLeft size={20} strokeWidth={2.5} />
            </button>
            <span className="text-base font-bold text-[#0e0f0c]">Match details</span>
            <button
              onClick={startEdit}
              aria-label="Edit match"
              className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#454745] active:bg-[#1633001f]"
            >
              <Pencil size={20} />
            </button>
          </div>
        )}

        <Segmented
          tab={tab}
          setTab={setTab}
          firstLabel={editable ? "Match" : "Summary"}
          secondLabel={editable ? "Details" : "Live"}
        />

        {editable && tab === "match" && (
          <LiveScore
            live={view}
            teamName={teamName}
            us={us}
            them={them}
            locked={false}
            showSwap={false}
            plusDisabled={false}
            onOurGoal={() => setGoalEditor({})}
            onOppGoal={addOppGoal}
          />
        )}
      </div>

      {tab === "match" ? (
        editable ? (
          <div className="space-y-4">
            <GoalFeed
              events={view.events}
              nameOf={nameOf}
              teamName={teamName}
              opposition={view.opposition}
              home={view.home}
              locked={false}
              onMenu={(e) => (e.type === "team" ? setGoalMenu(e) : setConfirmDelEvt(e))}
            />
            {view.events.length === 0 && (
              <p className="rounded-3xl bg-[#16330014] p-4 text-sm text-[#454745]">
                No goals recorded.
              </p>
            )}

            {!view.tournament && (
              <Medals medals={view.medals} nameOf={nameOf} onEdit={() => setMedalEditor(true)} />
            )}

            <button
              onClick={() => setConfirmDelMatch(true)}
              className="h-11 w-full rounded-full bg-[#16330014] text-base font-bold text-[#454745] active:bg-[#1633001f]"
            >
              Delete match
            </button>
          </div>
        ) : (
          <MatchCard
            s={s}
            date={view.date}
            type={view.type}
            events={view.events}
            teamEv={teamEv}
            home={view.home}
            medals={view.medals}
            showAwards={!view.tournament}
            nameOf={nameOf}
            flash={flash}
          />
        )
      ) : editable ? (
        <MatchSetupForm
          opposition={view.opposition}
          date={view.date}
          home={view.home}
          type={view.type}
          tournament={view.tournament}
          format={view.format}
          showFormat={!view.tournament}
          players={sortedLineUp}
          isPlaying={isPlaying}
          lockedIds={scoredIds}
          onOpposition={(v) => updDraft((d) => ({ ...d, opposition: v }))}
          onDate={(v) => updDraft((d) => ({ ...d, date: v }))}
          onHome={(v) => updDraft((d) => ({ ...d, home: v }))}
          onType={(v) =>
            updDraft((d) => ({ ...d, type: v, tournament: v === "tournament" ? d.tournament : "" }))
          }
          onTournament={(v) => updDraft((d) => ({ ...d, tournament: v }))}
          onFormat={(v) => updDraft((d) => ({ ...d, format: v }))}
          onTogglePlayer={onToggle}
        />
      ) : (
        <div className="space-y-4">
          <GoalFeed
            events={view.events}
            nameOf={nameOf}
            teamName={teamName}
            opposition={view.opposition}
            home={view.home}
            locked
            onMenu={() => {}}
          />
          {view.events.length === 0 && (
            <p className="rounded-3xl bg-[#16330014] p-4 text-sm text-[#454745]">
              No goals recorded.
            </p>
          )}
        </div>
      )}

      {confirmClose && (
        <Modal
          title="Discard changes?"
          body="Your edits to this match won't be saved."
          confirmLabel="Discard"
          danger
          onCancel={() => setConfirmClose(false)}
          onConfirm={exitEdit}
        />
      )}
      {confirmSave && (
        <Modal
          title="Save changes?"
          body={`This updates the result to ${s.l} ${s.ls} – ${s.rs} ${s.r} and your season totals.`}
          confirmLabel="Save"
          onCancel={() => setConfirmSave(false)}
          onConfirm={commit}
        />
      )}
      {confirmDelEvt && (
        <Modal
          title={
            confirmDelEvt.type === "halftime" ||
            confirmDelEvt.type === "period" ||
            confirmDelEvt.type === "fulltime"
              ? "Remove this marker?"
              : "Remove this opposition goal?"
          }
          body="This can't be undone."
          confirmLabel="Remove"
          danger
          onCancel={() => setConfirmDelEvt(null)}
          onConfirm={() => {
            deleteEvent(confirmDelEvt.id);
            setConfirmDelEvt(null);
          }}
        />
      )}
      {goalMenu && (
        <Modal
          title="Edit or delete this goal?"
          body="Deleting it can't be undone."
          confirmLabel="Edit"
          secondaryLabel="Delete"
          onCancel={() => setGoalMenu(null)}
          onConfirm={() => {
            setGoalEditor({ eventId: goalMenu.id });
            setGoalMenu(null);
          }}
          onSecondary={() => {
            deleteEvent(goalMenu.id);
            setGoalMenu(null);
          }}
        />
      )}
      {confirmDelMatch && (
        <Modal
          title="Delete this match?"
          body="It's removed from your season and totals. This can't be undone."
          confirmLabel="Delete"
          danger
          onCancel={() => setConfirmDelMatch(false)}
          onConfirm={() => {
            setData((d) => ({ ...d, matches: d.matches.filter((m) => m.id !== match.id) }));
            flash("Match deleted");
            onBack();
          }}
        />
      )}
    </div>
  );
}

// Groups a team event field (scorerId/assistId) into ordered, deduped names,
// appending "(N)" when a player did it more than once.
function summarizeEvents(events, key, nameOf) {
  const order = [];
  const counts = {};
  events.forEach((e) => {
    const id = e[key];
    if (!id) return;
    if (!(id in counts)) {
      counts[id] = 0;
      order.push(id);
    }
    counts[id] += 1;
  });
  return order.map((id) => (counts[id] > 1 ? `${nameOf(id)} (${counts[id]})` : nameOf(id)));
}

// Renders a DOM node to a PNG blob for sharing. Captured at whatever CSS
// width the node itself is styled to (see MatchCard's offscreen export
// clone, fixed at 360px) and upscaled via `pixelRatio` for a crisp,
// retina-ready image; height always matches the node's natural rendered
// height. Uses html-to-image (an SVG-foreignObject renderer, i.e. the real
// browser lays out and paints the text) rather than html2canvas, which
// reimplements text metrics itself and was clipping, misaligning and
// unevenly spacing text compared to how the card actually renders on screen.
async function exportCardImage(node) {
  const blob = await htmlToImage.toBlob(node, { pixelRatio: 3 });
  if (!blob) throw new Error("toBlob failed");
  return blob;
}

function ShareSheet({ status, onCopy, onSave, onRetry, onCancel, canCopy }) {
  const ready = status === "ready";
  const rendering = status === "rendering";
  const failed = status === "error";
  return (
    <div
      className="fixed inset-0 z-50 flex items-end justify-center p-4 sm:items-center"
      style={{ backgroundColor: "rgba(15,23,42,0.45)" }}

        <h3 className="text-base font-semibold text-slate-900">Share match card</h3>
        <p className="mt-1 text-sm text-slate-500">
          {failed
            ? "Couldn't create the image — try again."
            : rendering
            ? "Preparing image…"
            : "Export this card as an image to copy or save."}
        </p>
        <div className="mt-5 flex flex-col gap-2">
          {failed ? (
            <button
              onClick={onRetry}
              className="w-full rounded-xl bg-emerald-600 py-2.5 text-sm font-semibold text-white active:bg-emerald-700"
            >
              Try again
            </button>
          ) : (
            <>
              {canCopy && (
                <button
                  onClick={onCopy}
                  disabled={!ready}
                  className="w-full rounded-xl bg-emerald-600 py-2.5 text-sm font-semibold text-white active:bg-emerald-700 disabled:opacity-50"
                >
                  Copy image
                </button>
              )}
              <button
                onClick={onSave}
                disabled={!ready}
                className={
                  "w-full rounded-xl py-2.5 text-sm font-semibold disabled:opacity-50 " +
                  (canCopy
                    ? "border border-slate-200 text-slate-700 active:bg-slate-50"
                    : "bg-emerald-600 text-white active:bg-emerald-700")
                }
              >
                Share or save image
              </button>
            </>
          )}
          <button
            onClick={onCancel}
            className="w-full rounded-xl border border-slate-200 py-2.5 text-sm font-medium text-slate-700 active:bg-slate-50"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>
  );
}

function MatchCard({ s, date, type, events, teamEv, home, medals, showAwards, nameOf, flash }) {
  const goals = summarizeEvents(teamEv, "scorerId", nameOf);
  const assists = summarizeEvents(teamEv, "assistId", nameOf);
  const awards = [
    ["🥇", medals.gold],
    ["🥈", medals.silver],
    ["🥉", medals.bronze],
  ];
  const halftime = events.find((e) => e.type === "halftime");
  const htLabel = halftime
    ? `HT: ${home ? halftime.us : halftime.them}–${home ? halftime.them : halftime.us}`
    : null;

  const exportRef = useRef(null);
  const [shareOpen, setShareOpen] = useState(false);
  const [status, setStatus] = useState("idle"); // idle | rendering | ready | error
  const [imgBlob, setImgBlob] = useState(null);
  const canCopy = typeof window !== "undefined" && !!(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write);

  const renderImage = async () => {
    setStatus("rendering");
    setImgBlob(null);
    try {
      const blob = await exportCardImage(exportRef.current);
      setImgBlob(blob);
      setStatus("ready");
    } catch (e) {
      setStatus("error");
    }
  };

  const onShare = () => {
    setShareOpen(true);
    renderImage();
  };

  const closeShare = () => {
    setShareOpen(false);
    setImgBlob(null);
    setStatus("idle");
  };

  const fileName =
    `${s.l}-vs-${s.r}-${date}`
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/(^-|-$)/g, "") + ".png";

  const copyImage = async () => {
    if (!imgBlob) return;
    try {
      await navigator.clipboard.write([new ClipboardItem({ "image/png": imgBlob })]);
      flash("Copied image");
      closeShare();
    } catch (e) {
      flash("Couldn't copy image");
    }
  };

  const downloadBlob = (blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  };

  // iOS Safari's `<a download>` doesn't save into Photos — it just opens the
  // image in a new tab, with no "Save to Camera Roll" affordance. The Web
  // Share API's file support is what actually gets you there: sharing a
  // File opens the native share sheet, and "Save Image" on it saves to
  // Photos. Feature-detect per file (canShare wants the real File, not just
  // a type check) and only fall back to the plain download where that API
  // isn't available at all (most desktop browsers), so desktop keeps a
  // one-tap save straight to Downloads.
  const saveImage = async () => {
    if (!imgBlob) return;
    const file = new File([imgBlob], fileName, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
      } catch (e) {
        if (e && e.name !== "AbortError") downloadBlob(imgBlob);
      }
      closeShare();
      return;
    }
    downloadBlob(imgBlob);
    closeShare();
  };

  return (
    <div className="rounded-3xl bg-[#163300] p-4">
      <MatchCardFace
        s={s}
        date={date}
        type={type}
        htLabel={htLabel}
        goals={goals}
        assists={assists}
        awards={awards}
        showAwards={showAwards}
        nameOf={nameOf}
      />

      <button
        onClick={onShare}
        className="mt-4 h-11 w-full rounded-full bg-[#e2f6d5] text-base font-bold text-[#163300] active:bg-[#d3efc0]"
      >
        Share
      </button>

      {/* Offscreen fixed-width (360px) copy of the card, minus this Share
          button — used purely as the source exportCardImage captures for
          export, so the shared image is a consistent size regardless of
          the viewport the card is actually being viewed at. The off-screen
          positioning lives on this outer wrapper only: exportCardImage
          serializes the captured node's own styles into an SVG
          foreignObject, and a `position: fixed; left: -10000px` on the
          captured node itself would carry into that foreignObject's own
          coordinate space and render the content outside the captured
          viewport (an all-transparent "successful" export). */}
      <div aria-hidden="true" className="pointer-events-none" style={{ position: "fixed", top: 0, left: "-10000px" }}>
        <div ref={exportRef} className="rounded-3xl bg-[#163300] p-4" style={{ width: 360 }}>
          <MatchCardFace
            s={s}
            date={date}
            type={type}
            htLabel={htLabel}
            goals={goals}
            assists={assists}
            awards={awards}
            showAwards={showAwards}
            nameOf={nameOf}
          />
        </div>
      </div>

      {shareOpen && (
        <ShareSheet
          status={status}
          onCopy={copyImage}
          onSave={saveImage}
          onRetry={renderImage}
          onCancel={closeShare}
          canCopy={canCopy}
        />
      )}
    </div>
  );
}

function SaveGoalScreen({ players, initial, onSave, onClose }) {
  const [step, setStep] = useState("scorer");
  const [scorerId, setScorerId] = useState(initial ? initial.scorerId : null);
  const [assistId, setAssistId] = useState(initial ? initial.assistId : null);

  const title = step === "scorer" ? "Goalscorer" : "Assist";
  const selectedId = step === "scorer" ? scorerId : assistId;
  const sorted = [...players].sort((a, b) => a.name.localeCompare(b.name));
  const pick = (pid) => {
    if (step === "scorer") {
      const next = scorerId === pid ? null : pid;
      setScorerId(next);
      if (next !== null) setStep("assist");
    } else {
      setAssistId((c) => (c === pid ? null : pid));
    }
  };
  const iconBtn =
    "flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#0e0f0c] active:bg-[#1633001f] disabled:pointer-events-none disabled:opacity-40";

  return (
    <div className="fixed inset-0 z-40 flex flex-col bg-white">
      <div className="border-b border-black/[0.06] bg-white/80 backdrop-blur-xl">
        <div className="mx-auto flex max-w-md items-center justify-between px-6 pb-2 pt-6">
          {step === "scorer" ? (
            <button onClick={onClose} aria-label="Close" className={iconBtn}>
              <X size={20} strokeWidth={2.5} />
            </button>
          ) : (
            <button onClick={() => setStep("scorer")} aria-label="Back" className={iconBtn}>
              <ChevronLeft size={20} />
            </button>
          )}
          <span className="text-base font-bold text-[#0e0f0c]">Goal!</span>
          <button
            onClick={() => onSave({ scorerId, assistId })}
            aria-label="Save goal"
            className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#9fe870] text-[#163300] active:bg-[#8fd95f]"
          >
            <Check size={20} strokeWidth={2.5} />
          </button>
        </div>
      </div>

      <div className="mx-auto w-full max-w-md flex-1 overflow-y-auto p-6">
        <h1 className="text-[34px] font-bold leading-none tracking-tight text-[#0e0f0c]">
          {title}
        </h1>

        <div className="mt-4 space-y-4">
          {players.length === 0 ? (
            <p className="rounded-3xl bg-[#16330014] p-4 text-sm text-[#454745]">
              No players in the line-up.
            </p>
          ) : (
            sorted.map((p) => {
              const selected = selectedId === p.id;
              return (
                <button
                  key={p.id}
                  onClick={() => pick(p.id)}
                  className={
                    "flex w-full items-center rounded-3xl p-4 text-left text-base font-bold text-[#0e0f0c] transition-colors " +
                    (selected ? "bg-[#9fe870]" : "bg-[#16330014] active:bg-[#1633001f]")
                  }
                >
                  {p.name}
                </button>
              );
            })
          )}
        </div>
      </div>

    </div>
  );
}

  return (

      <div className="border-b border-black/[0.06] bg-white/80 backdrop-blur-xl">
        <div className="mx-auto flex max-w-md items-center justify-between px-6 pb-2 pt-6">
          {stepIdx === 0 ? (
            <button onClick={onCancel} aria-label="Close" className={iconBtn}>
              <X size={20} strokeWidth={2.5} />
            </button>
          ) : (
            <button
              onClick={() => setStepIdx((i) => i - 1)}
              aria-label="Back"
              className={iconBtn}
            >
              <ChevronLeft size={20} />
            </button>
          )}
          <span className="text-base font-bold text-[#0e0f0c]">Awards</span>
          <button
            onClick={() => onDone(medals)}
            aria-label="Save awards"
            className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#9fe870] text-[#163300] active:bg-[#8fd95f]"
          >
            <Check size={20} strokeWidth={2.5} />
          </button>
        </div>
      </div>

      <div className="mx-auto w-full max-w-md flex-1 overflow-y-auto p-6">
        <h1 className="text-[34px] font-bold leading-none tracking-tight text-[#0e0f0c]">
          {cat.label}
        </h1>

        <div className="mt-4 space-y-4">
          {players.length === 0 ? (
            <p className="rounded-3xl bg-[#16330014] p-4 text-sm text-[#454745]">
              No players in the line-up.
            </p>
          ) : (
            sorted.map((p) => {
              const selected = medals[cat.key] === p.id;
              const takenElsewhere = MEDAL_CATEGORIES.some(
                (o) => o.key !== cat.key && medals[o.key] === p.id
              );
              return (
                <button
                  key={p.id}
                  disabled={takenElsewhere}
                  onClick={() => pick(p.id)}
                  className={
                    "flex w-full items-center rounded-3xl p-4 text-left text-base font-bold transition-colors " +
                    (selected
                      ? "bg-[#9fe870] text-[#0e0f0c]"
                      : takenElsewhere
                      ? "bg-[#16330014] text-[#0e0f0c66]"
                      : "bg-[#16330014] text-[#0e0f0c] active:bg-[#1633001f]")
                  }
                >
                  <span className="flex-1 truncate">{p.name}</span>
                  {takenElsewhere && (
                    <span className="ml-2 shrink-0 text-xs font-bold text-[#0e0f0c66]">
                      {MEDAL_CATEGORIES.find((o) => medals[o.key] === p.id).label}
                    </span>
                  )}
                </button>
              );
            })
          )}
        </div>
      </div>
    </div>
  );
}

function LiveEditSheet({ live, squad, lockedIds, onSave, onCancel }) {
  const snap = (l) => JSON.stringify({
    opposition: l.opposition,
    date: l.date,
    home: l.home,
    type: l.type || null,
    tournament: l.tournament || "",
    format: l.format !== undefined ? l.format : "halves",
    playing: l.playing || {},
  });
  const baseRef = useRef(snap(live));
  const [draft, setDraft] = useState({
    opposition: live.opposition,
    date: live.date,
    home: live.home,
    type: live.type || null,
    tournament: live.tournament || "",
    format: live.format !== undefined ? live.format : "halves",
    playing: { ...(live.playing || {}) },
  });
  const [confirmClose, setConfirmClose] = useState(false);
  const [confirmSave, setConfirmSave] = useState(false);
  const isPlaying = (id) => draft.playing[id] !== false;
  const dirty = () => snap(draft) !== baseRef.current;
  const tryClose = () => (dirty() ? setConfirmClose(true) : onCancel());
  const trySave = () => (dirty() ? setConfirmSave(true) : onCancel());
  const commit = () =>
    onSave({ ...draft, opposition: draft.opposition.trim() || "Opposition" });

  return (
    <div className="fixed inset-0 z-40 flex flex-col bg-white">
      <div className="border-b border-black/[0.06] bg-white/80 backdrop-blur-xl">
        <div className="mx-auto flex max-w-md items-center justify-between px-6 pb-2 pt-6">
          <button
            onClick={tryClose}
            aria-label="Close"
            className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#0e0f0c] active:bg-[#1633001f]"
          >
            <X size={20} strokeWidth={2.5} />
          </button>
          <span className="text-base font-bold text-[#0e0f0c]">Edit match</span>
          <button
            onClick={trySave}
            aria-label="Save"
            className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#9fe870] text-[#163300] active:bg-[#8fd95f]"
          >
            <Check size={20} strokeWidth={2.5} />
          </button>
        </div>
      </div>

      <div className="mx-auto w-full max-w-md flex-1 overflow-y-auto px-6 pb-28 pt-4">
        <MatchSetupForm
          opposition={draft.opposition}
          date={draft.date}
          home={draft.home}
          type={draft.type}
          tournament={draft.tournament}
          format={draft.format}
          showFormat={!draft.tournament}
          players={squad}
          isPlaying={isPlaying}
          lockedIds={lockedIds}
          onOpposition={(v) => setDraft((d) => ({ ...d, opposition: v }))}
          onDate={(v) => setDraft((d) => ({ ...d, date: v }))}
          onHome={(v) => setDraft((d) => ({ ...d, home: v }))}
          onType={(v) =>
            setDraft((d) => ({ ...d, type: v, tournament: v === "tournament" ? d.tournament : "" }))
          }
          onTournament={(v) => setDraft((d) => ({ ...d, tournament: v }))}
          onFormat={(v) => setDraft((d) => ({ ...d, format: v }))}
          onTogglePlayer={(p) =>
            setDraft((d) => ({
              ...d,
              playing: { ...d.playing, [p.id]: d.playing[p.id] === false },
            }))
          }
        />
      </div>

      {confirmClose && (
        <Modal
          title="Discard changes?"
          body="Your changes to this match won't be saved."
          confirmLabel="Discard"
          danger
          onCancel={() => setConfirmClose(false)}
          onConfirm={onCancel}
        />
      )}
      {confirmSave && (
        <Modal
          title="Save changes?"
          body="This updates the match details for everyone."
          confirmLabel="Save"
          onCancel={() => setConfirmSave(false)}
          onConfirm={commit}
        />
      )}
    </div>
  );
}
