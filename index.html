// Renames/re-dates a tournament everywhere it's referenced: the active
// live tournament (if it's the one being edited), every match tagged with
// it, and its entry in the tournamentMedals map (keyed by name).
function applyTournamentEdit(setData, oldName, { name, date }) {
  setData((d) => {
    const medalsForOld = d.tournamentMedals[oldName];
    const nextMedals = { ...d.tournamentMedals };
    if (medalsForOld !== undefined) {
      delete nextMedals[oldName];
      nextMedals[name] = medalsForOld;
    }
    return {
      ...d,
      tournament:
        d.tournament && d.tournament.name === oldName
          ? { ...d.tournament, name, date }
          : d.tournament,
      matches: d.matches.map((m) =>
        m.tournament === oldName ? { ...m, tournament: name, date } : m
      ),
      tournamentMedals: nextMedals,
    };
  });
}

// Deletes a tournament and every match played under it, clearing the
// active tournament/live match and its medals if they reference it.
function applyTournamentDelete(setData, name) {
  setData((d) => {
    const nextMedals = { ...d.tournamentMedals };
    delete nextMedals[name];
    return {
      ...d,
      tournament: d.tournament && d.tournament.name === name ? null : d.tournament,
      live: d.live && d.live.tournament === name ? null : d.live,
      matches: d.matches.filter((m) => m.tournament !== name),
      tournamentMedals: nextMedals,
    };
  });
}

function EditTournament({ name, date, onCancel, onSave, onDelete }) {
  const baseRef = useRef(JSON.stringify({ name, date }));
  const [draft, setDraft] = useState({ name, date });
  const [confirmClose, setConfirmClose] = useState(false);
  const [confirmSave, setConfirmSave] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const dirty = () => JSON.stringify(draft) !== baseRef.current;
  const tryClose = () => (dirty() ? setConfirmClose(true) : onCancel());
  const trySave = () => (dirty() ? setConfirmSave(true) : onCancel());
  const commit = () => {
    onSave(draft);
    setConfirmSave(false);
  };

  return (
    <div>
      <div className="glass-scrim sticky top-0 z-20 -mx-6 -mt-6 mb-4 border-b border-black/[0.06] bg-white/65 px-6 pb-4 pt-6">
        <div className="flex items-center justify-between">
          <button
            onClick={tryClose}
            aria-label="Close"
            className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#0e0f0c] active:bg-[#1633001f]"
          >
            <X size={20} strokeWidth={2.5} />
          </button>
          <span className="text-base font-bold text-[#0e0f0c]">Edit tournament</span>
          <button
            onClick={trySave}
            aria-label="Save"
            className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#9fe870] text-[#163300] active:bg-[#8fd95f]"
          >
            <Check size={20} strokeWidth={2.5} />
          </button>
        </div>
      </div>

      <div className="mx-auto flex w-full max-w-md flex-col gap-6 pb-28 pt-4">
        <div className="flex flex-col gap-2">
          <label className="text-base font-bold text-black">Tournament name</label>
          <input
            value={draft.name}
            onChange={(e) => setDraft((d) => ({ ...d, name: e.target.value }))}
            placeholder="Tournament name"
            className="h-11 w-full rounded-lg border border-[#0e0f0c33] px-3 text-base text-[#0e0f0c] outline-none placeholder:text-[#0e0f0c66] focus:border-[#0e0f0c]"
          />
        </div>

        <div className="flex flex-col gap-2">
          <label className="text-base font-bold text-black">Match date</label>
          <input
            type="date"
            value={draft.date}
            onChange={(e) => setDraft((d) => ({ ...d, date: e.target.value }))}
            className="block h-11 w-full min-w-0 max-w-full appearance-none rounded-lg border border-[#0e0f0c33] bg-white px-3 text-base text-[#0e0f0c] outline-none focus:border-[#0e0f0c]"
          />
        </div>

        <button
          onClick={() => setConfirmDelete(true)}
          className="h-11 w-full rounded-full bg-[#16330014] text-base font-bold text-[#454745] active:bg-[#1633001f]"
        >
          Delete tournament
        </button>
      </div>

      {confirmDelete && (
        <Modal
          title="Delete this tournament?"
          body={`Removes "${name}" and all matches played under it from your season. This can't be undone.`}
          confirmLabel="Delete"
          danger
          onCancel={() => setConfirmDelete(false)}
          onConfirm={() => {
            onDelete();
            setConfirmDelete(false);
          }}
        />
      )}
      {confirmClose && (
        <Modal
          title="Discard changes?"
          body="Your changes to this tournament won't be saved."
          confirmLabel="Discard"
          danger
          onCancel={() => setConfirmClose(false)}
          onConfirm={onCancel}
        />
      )}
      {confirmSave && (
        <Modal
          title="Save changes?"
          body="This updates the tournament for every match played under it."
          confirmLabel="Save"
          onCancel={() => setConfirmSave(false)}
          onConfirm={commit}
        />
      )}
    </div>
  );
}

function Live({ data, setData, roster, teamName, setTab, flash }) {
  const [editSheet, setEditSheet] = useState(false);
  const [goalEditor, setGoalEditor] = useState(null);
  const [awardMedals, setAwardMedals] = useState(false);
  const [confirmEnd, setConfirmEnd] = useState(false);
  const [confirmDiscardSetup, setConfirmDiscardSetup] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [goalMenu, setGoalMenu] = useState(null);
  const [tourneySetup, setTourneySetup] = useState(false);
  const [confirmEndTournament, setConfirmEndTournament] = useState(false);
  const [awardTourneyMedals, setAwardTourneyMedals] = useState(false);
  const [pendingTourneyMedals, setPendingTourneyMedals] = useState(null);
  const [editingTournament, setEditingTournament] = useState(false);
  const { live, tournament } = data;

  const nameOf = (id) => (roster.find((p) => p.id === id) || {}).name || "—";

  const startSetup = () =>
    setData((d) => ({
      ...d,
      live: {
        date: d.tournament ? d.tournament.date : today(),
        opposition: "",
        home: true,
        type: null,
        tournament: d.tournament ? d.tournament.name : "",
        format: d.tournament ? d.tournament.format : "halves",
        active: false,
        ready: false,
        playing: d.tournament && d.tournament.playing
          ? { ...d.tournament.playing }
          : Object.fromEntries(
              d.roster.filter((p) => p.active).map((p) => [p.id, true])
            ),
        events: [],
      },
    }));

  if (tourneySetup) {
    return (
      <TournamentSetup
        onCancel={() => setTourneySetup(false)}
        onNext={(draft) => {
          setData((d) => ({ ...d, tournament: draft }));
          setTourneySetup(false);
        }}
      />
    );
  }

  if (awardTourneyMedals) {
    const eligible = [...roster]
      .filter((p) => p.active)
      .sort((a, b) => a.name.localeCompare(b.name));
    return (
      <AwardMedalsScreen
        players={eligible}
        initial={pendingTourneyMedals}
        onDone={(medals) => {
          setPendingTourneyMedals(medals);
          setAwardTourneyMedals(false);
          setConfirmEndTournament(true);
        }}
        onCancel={() => setAwardTourneyMedals(false)}
      />
    );
  }

  if (editingTournament && tournament) {
    return (
      <EditTournament
        name={tournament.name}
        date={tournament.date}
        onCancel={() => setEditingTournament(false)}
        onSave={({ name, date }) => {
          applyTournamentEdit(setData, tournament.name, { name, date });
          setEditingTournament(false);
          flash("Tournament updated");
        }}
        onDelete={() => {
          applyTournamentDelete(setData, tournament.name);
          setEditingTournament(false);
          flash("Tournament deleted");
        }}
      />
    );
  }

  if (!live) {
    return (
      <React.Fragment>
        <LiveEmpty
          tournament={tournament}
          matches={tournament ? data.matches.filter((m) => m.tournament === tournament.name) : []}
          onStart={startSetup}
          onStartTournament={() => setTourneySetup(true)}
          onEndTournament={() => setAwardTourneyMedals(true)}
          onEditTournament={() => setEditingTournament(true)}
        />
        {confirmEndTournament && (
          <Modal
            title="End tournament?"
            body={`Matches already saved under "${tournament?.name || "this tournament"}" are kept. You can start a new tournament at any time.`}
            confirmLabel="End tournament"
            danger
            onCancel={() => {
              setConfirmEndTournament(false);
              setPendingTourneyMedals(null);
            }}
            onConfirm={() => {
              setData((d) => ({
                ...d,
                tournament: null,
                tournamentMedals:
                  tournament && pendingTourneyMedals
                    ? { ...d.tournamentMedals, [tournament.name]: pendingTourneyMedals }
                    : d.tournamentMedals,
              }));
              setConfirmEndTournament(false);
              setPendingTourneyMedals(null);
            }}
          />
        )}
      </React.Fragment>
    );
  }

  const updLive = (fn) => setData((d) => ({ ...d, live: fn(d.live) }));

  const teamEvents = live.events.filter((e) => e.type === "team");
  const oppEvents = live.events.filter((e) => e.type === "opp");
  const us = teamEvents.length;
  const them = oppEvents.length;
  const s = sides(teamName, live.opposition, us, them, live.home);

  const goalsOf = (pid) => teamEvents.filter((e) => e.scorerId === pid).length;
  const assistsOf = (pid) => teamEvents.filter((e) => e.assistId === pid).length;

  const isPlaying = (pid) => live.playing?.[pid] !== false;
  const onToggle = (p) =>
    updLive((l) => ({ ...l, playing: { ...l.playing, [p.id]: !isPlaying(p.id) } }));

  const quarters = (live.format || "halves") === "quarters";
  const hasBreak = (key) =>
    live.events.some((e) =>
      key === "halftime" ? e.type === "halftime" : e.type === "period" && e.key === key
    );
  const halftimeMarker = live.events.find((e) => e.type === "halftime");
  const fulltimeMarker = live.events.find((e) => e.type === "fulltime");

  // Finishing the setup form (Lineup step's checkmark) moves the user into
  // the live match view, but doesn't start the match yet — that's a
  // separate, explicit Kick-off tap on the same button that later cycles
  // through the half-time/full-time stages.
  const finishSetup = () =>
    updLive((l) => ({
      ...l,
      ready: true,
      opposition: l.opposition.trim() || "Opposition",
    }));
  const kickOff = () => updLive((l) => ({ ...l, active: true }));
  const addOurGoal = () => setGoalEditor({});
  const addOppGoal = () =>
    updLive((l) => ({ ...l, events: [...l.events, { id: uid(), type: "opp" }] }));
  const addHalftime = () =>
    updLive((l) => ({
      ...l,
      events: [...l.events, { id: uid(), type: "halftime", us, them }],
    }));
  const addPeriod = (key) =>
    updLive((l) => ({
      ...l,
      events: [...l.events, { id: uid(), type: "period", key, us, them }],
    }));
  const addFulltime = () =>
    updLive((l) => ({
      ...l,
      events: [...l.events, { id: uid(), type: "fulltime", us, them }],
    }));
  const deleteEvent = (id) =>
    updLive((l) => ({ ...l, events: l.events.filter((e) => e.id !== id) }));
  const saveGoalEvent = ({ scorerId, assistId }) => {
    const editId = goalEditor && goalEditor.eventId;
    updLive((l) => ({
      ...l,
      events: editId
        ? l.events.map((e) => (e.id === editId ? { ...e, scorerId, assistId } : e))
        : [...l.events, { id: uid(), type: "team", scorerId, assistId }],
    }));
    setGoalEditor(null);
  };

  const lineUp = roster.filter((p) => p.active);
  const squadSorted = [...lineUp].sort((a, b) => a.name.localeCompare(b.name));
  const scoredIds = new Set();
  teamEvents.forEach((e) => {
    if (e.scorerId) scoredIds.add(e.scorerId);
    if (e.assistId) scoredIds.add(e.assistId);
  });
  const appeared = (pid) =>
    isPlaying(pid) || teamEvents.some((e) => e.scorerId === pid || e.assistId === pid);

  const end = () => {
    const goals = {};
    const assists = {};
    teamEvents.forEach((e) => {
      if (e.scorerId) goals[e.scorerId] = (goals[e.scorerId] || 0) + 1;
      if (e.assistId) assists[e.assistId] = (assists[e.assistId] || 0) + 1;
    });
    const record = {
      id: uid(),
      date: live.date,
      opposition: live.opposition.trim(),
      home: live.home,
      format: live.format !== undefined ? live.format : "halves",
      type: live.type || null,
      tournament: live.tournament || "",
      goals,
      assists,
      oppGoals: them,
      appearances: lineUp.filter((p) => appeared(p.id)).map((p) => p.id),
      events: live.events,
      medals: live.medals || { gold: null, silver: null, bronze: null },
    };
    setData((d) => ({ ...d, matches: [record, ...d.matches], live: null }));
    setConfirmEnd(false);
    flash(tournament ? "Match saved to your tournament" : "Match saved to your season");
    setTab("matches");
  };
  const discard = () => {
    setData((d) => ({ ...d, live: null }));
    setConfirmEnd(false);
    flash("Match discarded");
  };

  let matchBtn;
  if (!live.active) {
    matchBtn = { label: "Kick-off", primary: true, onClick: kickOff };
  } else if (fulltimeMarker) {
    matchBtn = {
      label: "Save match",
      primary: true,
      onClick: () => (tournament ? setConfirmEnd(true) : setAwardMedals(true)),
    };
  } else if (quarters) {
    const stage = QUARTER_STAGES.find((s) => !hasBreak(s.key));
    matchBtn = stage
      ? {
          label: stage.label,
          onClick: () => (stage.key === "halftime" ? addHalftime() : addPeriod(stage.key)),
        }
      : { label: "Full-time", onClick: addFulltime };
  } else {
    matchBtn = halftimeMarker
      ? { label: "Full-time", onClick: addFulltime }
      : { label: "Half-time", onClick: addHalftime };
  }

  if (awardMedals) {
    const eligible = lineUp
      .filter((p) => appeared(p.id))
      .sort((a, b) => a.name.localeCompare(b.name));
    return (
      <AwardMedalsScreen
        players={eligible}
        initial={live.medals}
        onDone={(medals) => {
          updLive((l) => ({ ...l, medals }));
          setAwardMedals(false);
          setConfirmEnd(true);
        }}
        onCancel={() => setAwardMedals(false)}
      />
    );
  }

  if (goalEditor) {
    const initial = goalEditor.eventId
      ? live.events.find((e) => e.id === goalEditor.eventId)
      : null;
    const pickPlayers = lineUp.filter(
      (p) =>
        isPlaying(p.id) ||
        (initial && (initial.scorerId === p.id || initial.assistId === p.id))
    );
    return (
      <SaveGoalScreen
        players={pickPlayers}
        initial={initial}
        onSave={saveGoalEvent}
        onClose={() => setGoalEditor(null)}
      />
    );
  }

  if (!live.ready) {
    return (
      <PreMatchSetup
        live={live}
        updLive={updLive}
        squad={squadSorted}
        isPlaying={isPlaying}
        onToggle={onToggle}
        onStart={finishSetup}
        inTournament={!!tournament}
        onFixSquad={(playing) =>
          setData((d) =>
            d.tournament
              ? { ...d, tournament: { ...d.tournament, playing } }
              : d
          )
        }
        onCancel={() => setData((d) => ({ ...d, live: null }))}
      />
    );
  }

  return (
    <div>
      <div className="glass-scrim sticky top-0 z-20 -mx-6 -mt-6 mb-4 space-y-3 border-b border-black/[0.06] bg-white/65 px-6 pb-4 pt-6">
        <LiveScore
          live={live}
          teamName={teamName}
          us={us}
          them={them}
          onOurGoal={addOurGoal}
          onOppGoal={addOppGoal}
          showSwap={false}
          plusDisabled={!live.active}
        />
        <div className="flex items-center gap-2">
          <button
            onClick={matchBtn.onClick}
            className={
              "h-11 flex-1 rounded-full text-base font-bold " +
              (matchBtn.primary
                ? "bg-[#9fe870] text-[#163300] active:bg-[#8fd95f]"
                : "bg-[#16330014] text-[#454745] active:bg-[#1633001f]")
            }
          >
            {matchBtn.label}
          </button>
          <button
            onClick={() => setEditSheet(true)}
            aria-label="Edit match"
            className="flex size-11 shrink-0 items-center justify-center rounded-full bg-[#16330014] text-[#454745] active:bg-[#1633001f]"
          >
            <Pencil size={20} />
          </button>
        </div>
      </div>

      {!live.active && (
        <button
          onClick={() => setConfirmDiscardSetup(true)}
          className="mb-4 h-11 w-full rounded-full bg-[#16330014] text-base font-bold text-[#454745] active:bg-[#1633001f]"
        >
          Discard match
        </button>
      )}

      <GoalFeed
        events={live.events}
        nameOf={nameOf}
        teamName={teamName}
        opposition={live.opposition}
        home={live.home}
        onMenu={(e) => (e.type === "team" ? setGoalMenu(e) : setConfirmDelete(e))}
      />

      {editSheet && (
        <LiveEditSheet
          live={live}
          squad={squadSorted}
          lockedIds={scoredIds}
          onCancel={() => setEditSheet(false)}
          onSave={(d) => {
            updLive((l) => ({
              ...l,
              opposition: d.opposition,
              date: d.date,
              home: d.home,
              type: d.type,
              tournament: d.tournament,
              format: d.format,
              playing: d.playing,
            }));
            setEditSheet(false);
            flash("Match details updated");
          }}
        />
      )}

      {confirmEnd && (
        <Modal
          title="Full-time — save this match?"
          body={`Final score ${s.l} ${s.ls} – ${s.rs} ${s.r}. Saving adds it to your ${tournament ? "tournament" : "season"} and updates the totals. Discard throws it away.`}
          confirmLabel={tournament ? "Save to tournament" : "Save to season"}
          secondaryLabel="Discard match"
          onConfirm={end}
          onSecondary={discard}
          onCancel={() => setConfirmEnd(false)}
        />
      )}

      {confirmDiscardSetup && (
        <Modal
          title="Discard this match?"
          body="Everything entered so far — line-up, format, opposition — is thrown away. This can't be undone."
          confirmLabel="Discard"
          danger
          onConfirm={discard}
          onCancel={() => setConfirmDiscardSetup(false)}
        />
      )}

      {confirmDelete && (
        <Modal
          title={
            confirmDelete.type === "halftime" ||
            confirmDelete.type === "period" ||
            confirmDelete.type === "fulltime"
              ? "Remove this marker?"
              : "Remove this opposition goal?"
          }
          body={
            confirmDelete.type === "halftime" ||
            confirmDelete.type === "period" ||
            confirmDelete.type === "fulltime"
              ? "The match button steps back one stage."
              : "It comes off the away score. This can't be undone."
          }
          confirmLabel="Remove"
          danger
          onCancel={() => setConfirmDelete(null)}
          onConfirm={() => {
            deleteEvent(confirmDelete.id);
            setConfirmDelete(null);
          }}
        />
      )}

      {goalMenu && (
        <Modal
          title="Edit or delete this goal?"
          body="Deleting it can't be undone."
          confirmLabel="Edit"
          secondaryLabel="Delete"
          onCancel={() => setGoalMenu(null)}
          onConfirm={() => {
            setGoalEditor({ eventId: goalMenu.id });
            setGoalMenu(null);
          }}
          onSecondary={() => {
            deleteEvent(goalMenu.id);
            setGoalMenu(null);
          }}
        />
      )}

    </div>
  );
}

function ScoreSide({ label, score, ours, teamName, opposition, onNameTap }) {
  return (
    <div className="flex min-w-0 flex-1 flex-col items-center gap-1 text-center">
      <div className="text-base font-light text-white">{label}</div>
      <div className="text-[34px] font-bold leading-none tabular-nums text-white">{score}</div>
      {ours ? (
        <div className="max-w-full truncate px-2 py-1 text-base font-bold text-white">
          {teamName.trim() || "Team"}
        </div>
      ) : (
        <button
          onClick={onNameTap}
          className="max-w-full truncate rounded-full bg-[#e2f6d5] px-3 py-1 text-base font-bold text-[#163300] active:bg-[#d3efc0]"
        >
          {opposition || "Add name"}
        </button>
      )}
    </div>
  );
}

function Empty({ icon, title, body }) {
  return (
    <div className="mt-10 flex flex-col items-center text-center">
      <div className="flex h-14 w-14 items-center justify-center rounded-2xl bg-slate-100 text-slate-400">
        {icon}
      </div>
      <h3 className="mt-4 font-semibold">{title}</h3>
      <p className="mt-1 max-w-xs text-sm text-slate-500">{body}</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
